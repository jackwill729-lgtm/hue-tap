<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3ccfd9">
<title>Hue Tap</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  body{background:hsl(170,70%,55%);transition:background-color .35s ease;cursor:pointer}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font:600 15px/1 -apple-system,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:10px 16px;
    border-radius:20px;opacity:0;transition:opacity .4s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toast"></div>
<script>
  const HOLD_MS = 500;         // how long to hold before a circle appears
  const GROW_PX_PER_S = 160;   // how fast a circle's radius grows, in screen pixels
  const FORCE_HOLD_MS = 2000;  // two-finger hold that switches colour forces on or off
  const DRAG_PX = 10;          // finger travel that turns a press into drawing a line
  const LINE_WIDTH = 6;        // new lines' thickness, in screen pixels
  const LINE_COLOR = '#FFFFFF';

  // ----- Colour -----
  // The background and every tapped circle each have their own hue, and no two
  // ever share one. New circles start white (no hue) until they're tapped.
  const WHITE = '#FFFFFF';
  const hsl = (h) => `hsl(${h},70%,55%)`;
  const hueGap = (a, b) => { const d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); };
  // Pick a new whole-degree hue: at least `far` degrees from the hues in `farFrom`
  // (so the change is easy to see) and as far as possible from the hues in
  // `taken`, never equal to any of them. Constraints relax only if the screen is crowded.
  function pickHue(taken, farFrom) {
    for (const far of [40, 25, 10, 1]) {
      for (let gap = 20; gap >= 1; gap = gap > 1 ? Math.ceil(gap / 2) : 0) {
        const ok = [];
        for (let h = 0; h < 360; h++)
          if (farFrom.every(f => hueGap(h, f) >= far) && taken.every(t => hueGap(h, t) >= gap)) ok.push(h);
        if (ok.length) return ok[Math.floor(Math.random() * ok.length)];
      }
    }
    return null; // all 360 hues are in use
  }
  const circleHues = (except) => circles.filter(c => c !== except && c.hue != null).map(c => c.hue);
  let hue = Math.floor(Math.random() * 360);
  const theme = document.querySelector('meta[name=theme-color]');
  function paint() {
    document.body.style.backgroundColor = hsl(hue);
    theme.setAttribute('content', hsl(hue));
  }
  function nextHue() {
    const h = pickHue(circleHues(null), [hue]);
    if (h != null) { hue = h; paint(); }
  }
  paint();

  // ----- Circles, stored in screen coordinates so zoom has no limits -----
  // Every zoom or pan is applied directly to each circle. Small circles keep a
  // centre point. Huge ones (bigger than BIG) are kept as "the point on the edge
  // nearest the screen, plus the direction to the centre", re-anchored every
  // frame, so their edges stay sharp however far you zoom in.
  const BIG = 2e6, SMALL = 1e6;
  const circles = [];  // {cx, cy, r, color, hue} or {big:true, ox, oy, nx, ny, r, color, hue}
  // Lines: pts is a flat [x0, y0, x1, y1, ...] smoothed polyline in screen
  // coordinates, w its thickness. raw holds the finger points while drawing.
  const strokes = [];
  const history = [];  // circles and lines in the order they were made, for undo
  function undoLast() {
    while (history.length) {
      const item = history.pop();
      const list = item.type === 'circle' ? circles : strokes;
      const i = list.indexOf(item.obj);
      if (i < 0) continue;
      list.splice(i, 1);
      dirty = true;
      toast(item.type === 'circle' ? 'Removed circle' : 'Removed line');
      if (navigator.vibrate) navigator.vibrate(10);
      return;
    }
    toast('Nothing to remove');
  }

  // Smooth a flat point list with Chaikin corner-cutting, keeping both ends.
  function smooth(raw, passes) {
    let p = raw;
    for (let n = 0; n < passes; n++) {
      if (p.length < 6) break;
      const q = [p[0], p[1]];
      for (let i = 0; i + 3 < p.length; i += 2) {
        const x0 = p[i], y0 = p[i + 1], x1 = p[i + 2], y1 = p[i + 3];
        q.push(0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1, 0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1);
      }
      q.push(p[p.length - 2], p[p.length - 1]);
      p = q;
    }
    return p;
  }
  function strokeBox(st) {
    if (!st.box) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let i = 0; i < st.pts.length; i += 2) {
        const x = st.pts[i], y = st.pts[i + 1];
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      st.box = [x0, y0, x1, y1];
    }
    return st.box;
  }
  let W = innerWidth, H = innerHeight;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  function resize() {
    W = innerWidth; H = innerHeight;
    const d = devicePixelRatio || 1;
    canvas.width = Math.round(W * d); canvas.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    dirty = true;
  }

  // Rotate everything by angle a (radians) and scale by k around screen point
  // (px, py), then move by (dx, dy).
  function transformAll(k, px, py, dx, dy, a = 0) {
    const cos = Math.cos(a) * k, sin = Math.sin(a) * k;
    const cs = Math.cos(a), sn = Math.sin(a);
    for (const c of circles) {
      if (c.big) {
        const x = c.ox - px, y = c.oy - py;
        c.ox = px + x * cos - y * sin + dx; c.oy = py + x * sin + y * cos + dy;
        const nx = c.nx * cs - c.ny * sn, ny = c.nx * sn + c.ny * cs;
        c.nx = nx; c.ny = ny;
      } else {
        const x = c.cx - px, y = c.cy - py;
        c.cx = px + x * cos - y * sin + dx; c.cy = py + x * sin + y * cos + dy;
      }
      if (c.vx) { const vx = c.vx, vy = c.vy; c.vx = vx * cos - vy * sin; c.vy = vx * sin + vy * cos; }
      c.r *= k;
    }
    for (const st of strokes) {
      for (const arr of [st.pts, st.raw]) {
        if (!arr) continue;
        for (let i = 0; i < arr.length; i += 2) {
          const x = arr[i] - px, y = arr[i + 1] - py;
          arr[i] = px + x * cos - y * sin + dx; arr[i + 1] = py + x * sin + y * cos + dy;
        }
      }
      st.w *= k; st.box = null;
    }
    normalise();
    dirty = true;
  }

  function normalise() {
    const sx = W / 2, sy = H / 2;
    for (const c of circles) {
      if (!c.big && c.r > BIG) {
        let dx = sx - c.cx, dy = sy - c.cy, L = Math.hypot(dx, dy);
        if (L === 0) { dx = 1; dy = 0; L = 1; }
        c.big = true;
        c.ox = c.cx + dx / L * c.r; c.oy = c.cy + dy / L * c.r;
        c.nx = -dx / L; c.ny = -dy / L;
      } else if (c.big && c.r < SMALL) {
        c.big = false;
        c.cx = c.ox + c.nx * c.r; c.cy = c.oy + c.ny * c.r;
      }
      if (c.big) {
        // Slide the anchor along the edge to the point nearest the screen centre.
        const ux = -c.ny, uy = c.nx;
        const t = (sx - c.ox) * ux + (sy - c.oy) * uy;
        if (!isFinite(c.r)) { c.ox += ux * t; c.oy += uy * t; continue; }
        if (Math.abs(t) >= c.r) continue;
        const root = Math.sqrt((c.r - t) * (c.r + t));
        const sag = t * t / (c.r + root);
        c.ox += ux * t + c.nx * sag; c.oy += uy * t + c.ny * sag;
        let nx = c.nx * (1 - sag / c.r) - ux * (t / c.r), ny = c.ny * (1 - sag / c.r) - uy * (t / c.r);
        const L = Math.hypot(nx, ny); c.nx = nx / L; c.ny = ny / L;
      }
    }
  }

  // ----- Colour forces -----
  // Each pair of coloured circles pulls or pushes by how far apart their hues are:
  // opposite hues (180° apart) attract most, neighbouring hues repel most, and
  // hues 90° apart ignore each other. White circles have no hue and feel nothing.
  // Bigger circles pull harder. The rule scales with zoom, so it looks the same
  // at any zoom level. Circles bump rather than overlap.
  const G = 6;              // overall strength
  const DAMPING = 1.2;      // friction, per second
  const RESTITUTION = 0.3;  // bounciness when circles touch
  let forcesOn = false;
  let lastT = performance.now();

  function stepForces(dt) {
    const bodies = circles.filter(c => !c.big && c.r > 0 && !(press && press.circle === c));
    for (const c of bodies) { c.vx = c.vx || 0; c.vy = c.vy || 0; c.ax = 0; c.ay = 0; }
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      for (let j = i + 1; j < bodies.length; j++) {
        const b = bodies[j];
        let dx = b.cx - a.cx, dy = b.cy - a.cy;
        let d = Math.hypot(dx, dy);
        if (d === 0) { dx = 1e-6 * (a.r + b.r); dy = 0; d = Math.abs(dx); }
        const ux = dx / d, uy = dy / d;
        if (a.hue != null && b.hue != null) {
          const pull = -Math.cos(hueGap(a.hue, b.hue) * Math.PI / 180); // +1 attract … -1 repel
          const soft = Math.max(d, a.r + b.r);   // no runaway force once touching
          const k = G * pull / soft;              // 2D gravity: acceleration ~ mass / distance
          a.ax += ux * k * b.r * b.r; a.ay += uy * k * b.r * b.r;
          b.ax -= ux * k * a.r * a.r; b.ay -= uy * k * a.r * a.r;
        }
      }
    }
    const f = Math.exp(-DAMPING * dt);
    for (const c of bodies) {
      c.vx = (c.vx + c.ax * dt) * f; c.vy = (c.vy + c.ay * dt) * f;
      c.cx += c.vx * dt; c.cy += c.vy * dt;
    }
    // Collisions: push overlapping circles apart and soak up the impact.
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      for (let j = i + 1; j < bodies.length; j++) {
        const b = bodies[j];
        const dx = b.cx - a.cx, dy = b.cy - a.cy, d = Math.hypot(dx, dy), min = a.r + b.r;
        if (d >= min || d === 0) continue;
        const ux = dx / d, uy = dy / d, ma = a.r * a.r, mb = b.r * b.r, overlap = min - d;
        a.cx -= ux * overlap * mb / (ma + mb); a.cy -= uy * overlap * mb / (ma + mb);
        b.cx += ux * overlap * ma / (ma + mb); b.cy += uy * overlap * ma / (ma + mb);
        const rel = (b.vx - a.vx) * ux + (b.vy - a.vy) * uy;
        if (rel < 0) {
          const jimp = -(1 + RESTITUTION) * rel / (1 / ma + 1 / mb);
          a.vx -= jimp / ma * ux; a.vy -= jimp / ma * uy;
          b.vx += jimp / mb * ux; b.vy += jimp / mb * uy;
        }
      }
    }
    collideLines(bodies);
  }

  // Keep circles on their side of every line: push out and bounce off.
  function collideLines(bodies) {
    for (const st of strokes) {
      const p = st.pts, half = st.w / 2, [bx0, by0, bx1, by1] = strokeBox(st);
      for (const c of bodies) {
        const reach = c.r + half;
        if (c.cx < bx0 - reach || c.cx > bx1 + reach || c.cy < by0 - reach || c.cy > by1 + reach) continue;
        for (let i = 0; i + 3 < p.length; i += 2) {
          const ax = p[i], ay = p[i + 1], ex = p[i + 2] - ax, ey = p[i + 3] - ay;
          const len2 = ex * ex + ey * ey;
          let t = len2 ? ((c.cx - ax) * ex + (c.cy - ay) * ey) / len2 : 0;
          t = t < 0 ? 0 : t > 1 ? 1 : t;
          const qx = ax + ex * t, qy = ay + ey * t;
          let nx = c.cx - qx, ny = c.cy - qy, d = Math.hypot(nx, ny);
          if (d >= reach) continue;
          if (d === 0) { nx = -ey; ny = ex; d = Math.hypot(nx, ny) || 1; }
          nx /= d; ny /= d;
          c.cx = qx + nx * reach; c.cy = qy + ny * reach;
          const vn = (c.vx || 0) * nx + (c.vy || 0) * ny;
          if (vn < 0) { c.vx -= (1 + RESTITUTION) * vn * nx; c.vy -= (1 + RESTITUTION) * vn * ny; }
        }
      }
    }
  }

  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(text) {
    toastEl.textContent = text; toastEl.style.opacity = '1';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.opacity = '0', 1400);
  }
  function toggleForces() {
    forcesOn = !forcesOn;
    if (!forcesOn) for (const c of circles) { c.vx = 0; c.vy = 0; }
    toast(forcesOn ? 'Colour forces on' : 'Colour forces off');
    if (navigator.vibrate) navigator.vibrate([20, 60, 20]);
  }

  let dirty = true;
  function draw(now) {
    now = now || performance.now();
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (forcesOn && dt > 0) {
      // Enough sub-steps that no circle moves more than a third of its radius
      // per step, so circles can't tunnel through a line.
      let worst = 0;
      for (const c of circles) if (!c.big && c.r > 0 && c.vx) worst = Math.max(worst, Math.hypot(c.vx, c.vy) * dt / c.r);
      const steps = Math.min(60, Math.max(3, Math.ceil(worst * 3)));
      for (let i = 0; i < steps; i++) stepForces(dt / steps);
      normalise();
      dirty = true;
    }
    if (dirty) {
      dirty = false;
      ctx.clearRect(0, 0, W, H);
      const sx = W / 2, sy = H / 2, diag = Math.hypot(W, H);
      for (const c of circles) {
        if (c.r <= 0) continue;
        ctx.fillStyle = c.color;
        if (!c.big) {
          const d = Math.hypot(c.cx - sx, c.cy - sy);
          if (d - c.r > diag) continue;                                     // off screen
          if (c.r - d > diag) { ctx.fillRect(0, 0, W, H); continue; }      // covers screen
          ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2); ctx.fill();
        } else {
          // So big its edge is a straight line on screen: fill that side.
          const inside = (sx - c.ox) * c.nx + (sy - c.oy) * c.ny;
          if (inside > diag) { ctx.fillRect(0, 0, W, H); continue; }
          if (inside < -diag) continue;
          const ux = -c.ny, uy = c.nx, B = diag * 2;
          ctx.beginPath();
          ctx.moveTo(c.ox + ux * B, c.oy + uy * B);
          ctx.lineTo(c.ox - ux * B, c.oy - uy * B);
          ctx.lineTo(c.ox - ux * B + c.nx * B, c.oy - uy * B + c.ny * B);
          ctx.lineTo(c.ox + ux * B + c.nx * B, c.oy + uy * B + c.ny * B);
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.strokeStyle = LINE_COLOR; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const st of strokes) {
        const p = st.pts, [x0, y0, x1, y1] = strokeBox(st), m = st.w;
        if (x1 < -m || y1 < -m || x0 > W + m || y0 > H + m || p.length < 2) continue;
        ctx.lineWidth = st.w;
        ctx.beginPath();
        if (p.length === 2) { ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] + 0.01, p[1]); }
        else {
          // Skip segments far off screen so huge zooms stay safe to draw.
          let pen = false;
          for (let i = 0; i + 3 < p.length; i += 2) {
            const ax = p[i], ay = p[i + 1], bx = p[i + 2], by = p[i + 3];
            const off = (ax < -m && bx < -m) || (ay < -m && by < -m) || (ax > W + m && bx > W + m) || (ay > H + m && by > H + m);
            if (off) { pen = false; continue; }
            const far = Math.max(Math.abs(ax), Math.abs(ay), Math.abs(bx), Math.abs(by)) > 1e7;
            if (far) {
              // Clip a very long segment to a box around the screen before drawing it.
              const c = clipSeg(ax, ay, bx, by, -m - 10, -m - 10, W + m + 10, H + m + 10);
              if (!c) { pen = false; continue; }
              ctx.moveTo(c[0], c[1]); ctx.lineTo(c[2], c[3]); pen = false; continue;
            }
            if (!pen) { ctx.moveTo(ax, ay); pen = true; }
            ctx.lineTo(bx, by);
          }
        }
        ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  }
  // Liang–Barsky: the part of segment (ax,ay)-(bx,by) inside a rectangle, or null.
  function clipSeg(ax, ay, bx, by, x0, y0, x1, y1) {
    let t0 = 0, t1 = 1; const dx = bx - ax, dy = by - ay;
    for (const [p, q] of [[-dx, ax - x0], [dx, x1 - ax], [-dy, ay - y0], [dy, y1 - ay]]) {
      if (p === 0) { if (q < 0) return null; continue; }
      const r = q / p;
      if (p < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
      else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
    return [ax + dx * t0, ay + dy * t0, ax + dx * t1, ay + dy * t1];
  }
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);

  // ----- Press: tap for colour, hold to grow a circle -----
  let press = null; // {id, x, y, timer, circle, last, raf}
  function startCircle() {
    const c = { cx: press.x, cy: press.y, r: 0, color: WHITE };
    circles.push(c);
    history.push({ type: 'circle', obj: c });
    press.circle = c;
    press.last = performance.now();
    const grow = (now) => {
      if (!press || press.circle !== c) return;
      c.r += (now - press.last) / 1000 * GROW_PX_PER_S;
      press.last = now;
      normalise(); dirty = true;
      press.raf = requestAnimationFrame(grow);
    };
    press.raf = requestAnimationFrame(grow);
    if (navigator.vibrate) navigator.vibrate(15);
  }
  function beginPress(id, x, y) {
    if (press) return;
    press = { id, x, y, x0: x, y0: y, circle: null, stroke: null };
    press.timer = setTimeout(startCircle, HOLD_MS);
  }
  // Dragging before the hold kicks in draws a line instead.
  function movePress(id, x, y) {
    if (!press || id !== press.id || press.circle) return;
    press.x = x; press.y = y;
    if (!press.stroke) {
      if (Math.hypot(x - press.x0, y - press.y0) < DRAG_PX) return;
      clearTimeout(press.timer);
      press.stroke = { raw: [press.x0, press.y0], pts: [press.x0, press.y0], w: LINE_WIDTH, box: null };
      strokes.push(press.stroke);
      history.push({ type: 'line', obj: press.stroke });
    }
    const st = press.stroke, r = st.raw;
    if (Math.hypot(x - r[r.length - 2], y - r[r.length - 1]) < 3) return;
    r.push(x, y);
    st.pts = smooth(r, 3); st.box = null;
    dirty = true;
  }
  function finishStroke(st, keep) {
    const r = st.raw;
    let len = 0;
    for (let i = 0; i + 3 < r.length; i += 2) len += Math.hypot(r[i + 2] - r[i], r[i + 3] - r[i + 1]);
    if (!keep && len < 40) {                       // a stray start of a pinch
      strokes.splice(strokes.indexOf(st), 1);
      const h = history.findIndex(x => x.obj === st); if (h >= 0) history.splice(h, 1);
    }
    else { st.pts = smooth(r, 3); st.box = null; }
    delete st.raw;
    dirty = true;
  }
  // The top-most circle under a screen point, if any.
  function circleAt(x, y) {
    for (let i = circles.length - 1; i >= 0; i--) {
      const c = circles[i];
      if (c.r <= 0) continue;
      const inside = c.big ? (x - c.ox) * c.nx + (y - c.oy) * c.ny >= 0
                           : Math.hypot(x - c.cx, y - c.cy) <= c.r;
      if (inside) return c;
    }
    return null;
  }
  // Tap on a circle: give it a new hue. Tap on the background: change the background's hue.
  function handleTap(x, y) {
    const hit = circleAt(x, y);
    if (!hit) { nextHue(); return; }
    const far = hit.hue == null ? [hue] : [hue, hit.hue];
    const h = pickHue([...circleHues(hit), hue], far);
    if (h == null) return;
    hit.hue = h; hit.color = hsl(h);
    dirty = true;
  }
  // Ends the press. A circle that was growing stops and stays on screen.
  function endPress(tap) {
    if (!press) return;
    clearTimeout(press.timer);
    cancelAnimationFrame(press.raf);
    if (press.stroke) finishStroke(press.stroke, tap);
    else if (!press.circle && tap) handleTap(press.x, press.y);
    press = null;
  }

  // ----- Touch: one finger presses, two fingers pinch to zoom and pan -----
  const touches = new Map(); // id -> {x, y}
  let pinch = null;          // {d, a, mx, my} from the previous frame
  let gestureUsed = false;   // true once a pinch happened, until every finger is up
  let twoHold = null;        // {timer, start} while two fingers rest still
  // A quick two-finger swipe left removes the last circle or line. While two
  // fingers are down we remember the total zoom/pan/twist (as z -> A*z + B on
  // complex numbers) so a swipe can put the view back where it was.
  let swipe = null;          // {t0, start, ar, ai, br, bi}
  const SWIPE_MS = 800, SWIPE_PX = 70;
  function trackSwipe(k, px, py, dx, dy, a) {
    if (!swipe) return;
    const sr = k * Math.cos(a), si = k * Math.sin(a);                 // step A
    const tr = px - (sr * px - si * py) + dx, ti = py - (si * px + sr * py) + dy; // step B
    const ar = sr * swipe.ar - si * swipe.ai, ai = sr * swipe.ai + si * swipe.ar;
    const br = sr * swipe.br - si * swipe.bi + tr, bi = sr * swipe.bi + si * swipe.br + ti;
    swipe.ar = ar; swipe.ai = ai; swipe.br = br; swipe.bi = bi;
  }
  function finishSwipe(last) {
    const sw = swipe; swipe = null;
    if (!sw || !last) return;
    const mx = last.mx - sw.start.mx, my = last.my - sw.start.my;
    let turn = Math.abs(last.a - sw.start.a); if (turn > Math.PI) turn = 2 * Math.PI - turn;
    const ratio = last.d / sw.start.d;
    const isSwipe = performance.now() - sw.t0 < SWIPE_MS && mx < -SWIPE_PX && Math.abs(my) < 0.6 * -mx &&
                    ratio > 0.75 && ratio < 1.33 && turn < 0.4;
    if (!isSwipe) return;
    // Undo the pan the swipe caused: apply the inverse of z -> A*z + B.
    const m2 = sw.ar * sw.ar + sw.ai * sw.ai;
    const ir = sw.ar / m2, ii = -sw.ai / m2;                       // 1/A
    const k = Math.sqrt(ir * ir + ii * ii), a = Math.atan2(ii, ir);
    const ibr = -(ir * sw.br - ii * sw.bi), ibi = -(ir * sw.bi + ii * sw.br); // -B/A
    transformAll(k, 0, 0, ibr, ibi, a);
    undoLast();
  }
  const pts = () => [...touches.values()];
  function pinchState() {
    const [a, b] = pts();
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, a: Math.atan2(b.y - a.y, b.x - a.x),
             mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }

  const opts = { passive: false };
  document.addEventListener('touchstart', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
    if (touches.size === 1 && !gestureUsed) {
      const t = e.changedTouches[0];
      beginPress(t.identifier, t.clientX, t.clientY);
    } else if (touches.size >= 2) {
      endPress(false);          // a second finger means zoom, not a tap or hold
      gestureUsed = true;
      pinch = pinchState();
      cancelTwoHold();
      if (touches.size === 2) {
        swipe = { t0: performance.now(), start: pinch, ar: 1, ai: 0, br: 0, bi: 0 };
        twoHold = { start: pinch, timer: setTimeout(() => { twoHold = null; toggleForces(); }, FORCE_HOLD_MS) };
      }
    }
  }, opts);
  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (touches.has(t.identifier)) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
      movePress(t.identifier, t.clientX, t.clientY);
    }
    if (pinch && touches.size >= 2) {
      const now = pinchState();
      let da = now.a - pinch.a;               // twist between frames, kept within ±180°
      if (da > Math.PI) da -= 2 * Math.PI; else if (da < -Math.PI) da += 2 * Math.PI;
      transformAll(now.d / pinch.d, pinch.mx, pinch.my, now.mx - pinch.mx, now.my - pinch.my, da);
      trackSwipe(now.d / pinch.d, pinch.mx, pinch.my, now.mx - pinch.mx, now.my - pinch.my, da);
      pinch = now;
      if (twoHold) {             // moving the fingers means pinching, not holding
        const s0 = twoHold.start;
        let turn = Math.abs(now.a - s0.a); if (turn > Math.PI) turn = 2 * Math.PI - turn;
        if (Math.abs(now.d - s0.d) > 14 || Math.hypot(now.mx - s0.mx, now.my - s0.my) > 14 || turn > 0.12) cancelTwoHold();
      }
    }
  }, opts);
  function cancelTwoHold() { if (twoHold) { clearTimeout(twoHold.timer); twoHold = null; } }
  function liftTouches(e, cancelled) {
    cancelTwoHold();
    if (swipe) finishSwipe(cancelled ? null : pinch);
    for (const t of e.changedTouches) {
      touches.delete(t.identifier);
      if (press && press.id === t.identifier) endPress(!cancelled && !gestureUsed);
    }
    pinch = touches.size >= 2 ? pinchState() : null;
    if (touches.size === 0) gestureUsed = false;
  }
  document.addEventListener('touchend', (e) => { e.preventDefault(); liftTouches(e, false); }, opts);
  document.addEventListener('touchcancel', (e) => liftTouches(e, true), opts);

  // ----- Mouse (desktop): click/hold like a finger, scroll wheel to zoom -----
  document.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') beginPress('m', e.clientX, e.clientY); });
  document.addEventListener('pointermove', (e) => { if (e.pointerType !== 'touch') movePress('m', e.clientX, e.clientY); });
  document.addEventListener('pointerup', (e) => { if (e.pointerType !== 'touch') endPress(true); });
  document.addEventListener('pointercancel', (e) => { if (e.pointerType !== 'touch') endPress(false); });
  document.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.shiftKey) transformAll(1, e.clientX, e.clientY, 0, 0, (e.deltaY || e.deltaX) * 0.003); // Shift + scroll rotates
    else transformAll(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY, 0, 0);
  }, { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // For testing: window.__hue exposes state.
  window.__hue = { circles, strokes, transformAll, get hue() { return hue; }, get forcesOn() { return forcesOn; } };
</script>
