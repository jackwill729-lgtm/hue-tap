<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3ccfd9">
<title>Hue Tap</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  body{background:hsl(170,70%,55%);transition:background-color .35s ease;cursor:pointer}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font:600 15px/1 -apple-system,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:10px 16px;
    border-radius:20px;opacity:0;transition:opacity .4s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="o"></canvas>
<div id="toast"></div>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>
<script>
  const HOLD_MS = 500;         // how long to hold before a circle appears
  const GROW_PX_PER_S = 160;   // how fast a circle's radius grows, in screen pixels
  const FORCE_HOLD_MS = 2000;  // two-finger hold that switches colour forces on or off
  const DRAG_PX = 10;          // finger travel that turns a press into drawing a line
  const LINE_WIDTH = 6;        // new lines' thickness, in screen pixels
  const LINE_COLOR = '#FFFFFF';
  const DOT_R = 10;            // the black dot in the corner, and new dots, in screen pixels
  const DOT_HIT = 28;          // how close a finger must start to the corner dot to drag it
  const HUNTER_R = 8;          // the red dot in the other corner, and new hunters, in screen pixels
  const HUNTER_SPEED = 25;     // hunter radii per second, so it looks the same at any zoom
  const POP_S = 0.25;          // length of the pop animation
  const CLONE_EVERY = 20;      // a hunter clones itself every this many pops
  const EMIT_MEAN_S = 1.2;     // average time between circles from one dot while forces are on
  const FRAME_BUDGET_MS = 12;  // physics time per frame; beyond this the simulation slows rather than freezes

  // ----- Colour -----
  // The background and every tapped circle each have their own hue, and no two
  // ever share one. New circles start white (no hue) until they're tapped.
  const WHITE = '#FFFFFF';
  const hsl = (h) => `hsl(${h},70%,55%)`;
  const hueGap = (a, b) => { const d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); };
  // Circles may share colours (identical hues repel each other the hardest).
  // A random whole-degree hue at least `minGap` degrees from every hue in `avoid`
  // (so a tap's change is easy to see).
  function randomHue(avoid, minGap) {
    for (let tries = 0; tries < 100; tries++) {
      const h = Math.floor(Math.random() * 360);
      if (avoid.every(a => a == null || hueGap(h, a) >= minGap)) return h;
    }
    return Math.floor(Math.random() * 360);
  }
  let hue = Math.floor(Math.random() * 360);
  const theme = document.querySelector('meta[name=theme-color]');
  function paint() {
    document.body.style.backgroundColor = hsl(hue);
    theme.setAttribute('content', hsl(hue));
  }
  function nextHue() {
    hue = randomHue([hue], 40); paint();
  }
  paint();

  // ----- Circles, stored in screen coordinates so zoom has no limits -----
  // Every zoom or pan is applied directly to each circle. Small circles keep a
  // centre point. Huge ones (bigger than BIG) are kept as "the point on the edge
  // nearest the screen, plus the direction to the centre", re-anchored every
  // frame, so their edges stay sharp however far you zoom in.
  const BIG = 2e6, SMALL = 1e6;
  const circles = [];  // {cx, cy, r, color, hue} or {big:true, ox, oy, nx, ny, r, color, hue}
  // Lines: pts is a flat [x0, y0, x1, y1, ...] smoothed polyline in screen
  // coordinates, w its thickness. raw holds the finger points while drawing.
  const strokes = [];
  // Black dots dragged out of the corner. Stored like circles (same small/big
  // forms) so they zoom and turn with everything else; they emit coloured
  // circles while forces are on. wait = seconds until the next one.
  const dots = [];     // {cx, cy, r, wait} or the big form
  const emitWait = () => -Math.log(1 - Math.random()) * EMIT_MEAN_S;
  // Red hunters dragged out of the other corner: same small/big forms as circles.
  // Each one chases the nearest circle and pops it.
  const hunters = [];  // {cx, cy, r} or the big form
  const pops = [];     // {x, y, r, color, t0}: pop animations, in screen coordinates
  const history = [];  // circles, lines, dots and hunters in the order they were made, for undo
  function undoLast() {
    while (history.length) {
      const item = history.pop();
      const list = { circle: circles, dot: dots, hunter: hunters, line: strokes }[item.type];
      const i = list.indexOf(item.obj);
      if (i < 0) continue;
      list.splice(i, 1);
      dirty = true;
      toast({ circle: 'Removed circle', dot: 'Removed dot', hunter: 'Removed hunter', line: 'Removed line' }[item.type]);
      if (navigator.vibrate) navigator.vibrate(10);
      return;
    }
    toast('Nothing to remove');
  }

  // Smooth a flat point list with Chaikin corner-cutting, keeping both ends.
  function smooth(raw, passes) {
    let p = raw;
    for (let n = 0; n < passes; n++) {
      if (p.length < 6) break;
      const q = [p[0], p[1]];
      for (let i = 0; i + 3 < p.length; i += 2) {
        const x0 = p[i], y0 = p[i + 1], x1 = p[i + 2], y1 = p[i + 3];
        q.push(0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1, 0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1);
      }
      q.push(p[p.length - 2], p[p.length - 1]);
      p = q;
    }
    return p;
  }
  // Bounding box of a line, plus boxes for each run of CHUNK segments so
  // collisions only look closely at the parts of a line near a circle.
  const CHUNK = 16;
  function strokeBox(st) {
    if (!st.box) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const p = st.pts, chunks = [];
      for (let s = 0; s < p.length; s += 2 * CHUNK) {
        let cx0 = Infinity, cy0 = Infinity, cx1 = -Infinity, cy1 = -Infinity;
        const end = Math.min(p.length, s + 2 * CHUNK + 2);
        for (let i = s; i < end; i += 2) {
          const x = p[i], y = p[i + 1];
          if (x < cx0) cx0 = x; if (x > cx1) cx1 = x; if (y < cy0) cy0 = y; if (y > cy1) cy1 = y;
        }
        chunks.push(s, end, cx0, cy0, cx1, cy1);
        if (cx0 < x0) x0 = cx0; if (cx1 > x1) x1 = cx1; if (cy0 < y0) y0 = cy0; if (cy1 > y1) y1 = cy1;
      }
      st.box = [x0, y0, x1, y1];
      st.chunks = chunks;
    }
    return st.box;
  }
  let W = innerWidth, H = innerHeight;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d'), mainCtx = ctx;
  // The corner dot sits 32px in from the bottom-left, clear of any notch or home bar.
  const safeProbe = document.getElementById('safe');
  let dockX = 32, dockY = H - 32, redX = W - 32, redY = H - 32;
  const overlay = document.getElementById('o');   // flashing red dots and pops, redrawn every frame
  const octx = overlay.getContext('2d');
  function resize() {
    W = innerWidth; H = innerHeight;
    const cs = getComputedStyle(safeProbe);
    dockX = 32 + (parseFloat(cs.paddingLeft) || 0);
    dockY = H - 32 - (parseFloat(cs.paddingBottom) || 0);
    redX = W - 32 - (parseFloat(cs.paddingRight) || 0); redY = dockY;
    const d = devicePixelRatio || 1;
    canvas.width = Math.round(W * d); canvas.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    overlay.width = canvas.width; overlay.height = canvas.height;
    octx.setTransform(d, 0, 0, d, 0, 0);
    dirty = true;
  }

  // Rotate everything by angle a (radians) and scale by k around screen point
  // (px, py), then move by (dx, dy).
  function transformAll(k, px, py, dx, dy, a = 0) {
    const cos = Math.cos(a) * k, sin = Math.sin(a) * k;
    const cs = Math.cos(a), sn = Math.sin(a);
    for (const c of circles.concat(dots, hunters)) {
      if (c.big) {
        const x = c.ox - px, y = c.oy - py;
        c.ox = px + x * cos - y * sin + dx; c.oy = py + x * sin + y * cos + dy;
        const nx = c.nx * cs - c.ny * sn, ny = c.nx * sn + c.ny * cs;
        c.nx = nx; c.ny = ny;
      } else {
        const x = c.cx - px, y = c.cy - py;
        c.cx = px + x * cos - y * sin + dx; c.cy = py + x * sin + y * cos + dy;
      }
      if (c.vx) { const vx = c.vx, vy = c.vy; c.vx = vx * cos - vy * sin; c.vy = vx * sin + vy * cos; }
      c.r *= k;
    }
    for (const st of strokes) {
      for (const arr of [st.pts, st.raw]) {
        if (!arr) continue;
        for (let i = 0; i < arr.length; i += 2) {
          const x = arr[i] - px, y = arr[i + 1] - py;
          arr[i] = px + x * cos - y * sin + dx; arr[i + 1] = py + x * sin + y * cos + dy;
        }
      }
      st.w *= k; st.box = null;
    }
    normalise();
    dirty = true;
  }

  function normalise() {
    const sx = W / 2, sy = H / 2;
    for (const c of circles.concat(dots, hunters)) {
      if (!c.big && c.r > BIG) {
        let dx = sx - c.cx, dy = sy - c.cy, L = Math.hypot(dx, dy);
        if (L === 0) { dx = 1; dy = 0; L = 1; }
        c.big = true;
        c.ox = c.cx + dx / L * c.r; c.oy = c.cy + dy / L * c.r;
        c.nx = -dx / L; c.ny = -dy / L;
      } else if (c.big && c.r < SMALL) {
        c.big = false;
        c.cx = c.ox + c.nx * c.r; c.cy = c.oy + c.ny * c.r;
      }
      if (c.big) {
        // Slide the anchor along the edge to the point nearest the screen centre.
        const ux = -c.ny, uy = c.nx;
        const t = (sx - c.ox) * ux + (sy - c.oy) * uy;
        if (!isFinite(c.r)) { c.ox += ux * t; c.oy += uy * t; continue; }
        if (Math.abs(t) >= c.r) continue;
        const root = Math.sqrt((c.r - t) * (c.r + t));
        const sag = t * t / (c.r + root);
        c.ox += ux * t + c.nx * sag; c.oy += uy * t + c.ny * sag;
        let nx = c.nx * (1 - sag / c.r) - ux * (t / c.r), ny = c.ny * (1 - sag / c.r) - uy * (t / c.r);
        const L = Math.hypot(nx, ny); c.nx = nx / L; c.ny = ny / L;
      }
    }
  }

  // ----- Colour forces -----
  // Each pair of coloured circles pulls or pushes by how far apart their hues are:
  // opposite hues (180° apart) attract most, neighbouring hues repel most, and
  // hues 90° apart ignore each other. White circles have no hue and feel nothing.
  // Bigger circles pull harder. The rule scales with zoom, so it looks the same
  // at any zoom level. Circles bump rather than overlap.
  const G = 6;              // overall strength
  const DAMPING = 1.2;      // friction, per second
  const RESTITUTION = 0.3;  // bounciness when circles touch
  const SOFT_RATE = 30;     // how quickly partly permeable circles are eased apart (per second)
  let forcesOn = false;
  let lastT = performance.now();

  const bodies = [], coloured = [];   // reused every step, no per-step garbage
  const BUF_KEYS = ['x', 'y', 'r', 'hc', 'hs', 'ax', 'ay'], buf = { cap: 0 };
  function stepForces(dt) {
    bodies.length = 0; coloured.length = 0;
    for (const c of circles) {
      if (c.big || !(c.r > 0) || (press && press.circle === c)) continue;
      c.vx = c.vx || 0; c.vy = c.vy || 0; c.ax = 0; c.ay = 0;
      // Solidity = 1 - permeability: a circle the background's colour lets others
      // pass straight through it; the opposite colour is fully solid. White is solid.
      c.solid = c.hue == null ? 1 : hueGap(c.hue, hue) / 180;
      bodies.push(c);
      if (c.hue != null) {
        const t = c.hue * Math.PI / 180; c.hc = Math.cos(t); c.hs = Math.sin(t);  // cos(gap) = hc·hc' + hs·hs'
        coloured.push(c);
      }
    }
    // All pairs, on flat typed arrays (much faster than object fields for big counts).
    const n = coloured.length;
    if (n > buf.cap) { buf.cap = Math.max(n, buf.cap * 2); for (const k of BUF_KEYS) buf[k] = new Float64Array(buf.cap); }
    const X = buf.x, Y = buf.y, R = buf.r, HC = buf.hc, HS = buf.hs, AX = buf.ax, AY = buf.ay;
    for (let i = 0; i < n; i++) {
      const c = coloured[i]; X[i] = c.cx; Y[i] = c.cy; R[i] = c.r; HC[i] = c.hc; HS[i] = c.hs; AX[i] = 0; AY[i] = 0;
    }
    for (let i = 0; i < n; i++) {
      const ax0 = X[i], ay0 = Y[i], ar = R[i], ahc = HC[i], ahs = HS[i];
      let fax = 0, fay = 0;
      for (let j = i + 1; j < n; j++) {
        const br = R[j], dx = X[j] - ax0, dy = Y[j] - ay0, d = Math.sqrt(dx * dx + dy * dy);
        const ux = d > 0 ? dx / d : 1, uy = d > 0 ? dy / d : 0;
        const pull = -(ahc * HC[j] + ahs * HS[j]);   // +1 opposite hues attract … -1 neighbours repel
        const soft = d > ar + br ? d : ar + br;      // no runaway force once touching
        const k = G * pull / soft;                    // 2D gravity: acceleration ~ mass / distance
        const kb = k * br, ka = k * ar;               // (k·r)·r keeps tiny circles from underflowing
        fax += ux * kb * br; fay += uy * kb * br;
        AX[j] -= ux * ka * ar; AY[j] -= uy * ka * ar;
      }
      AX[i] += fax; AY[i] += fay;
    }
    for (let i = 0; i < n; i++) { coloured[i].ax = AX[i]; coloured[i].ay = AY[i]; }
    const f = Math.exp(-DAMPING * dt);
    for (const c of bodies) {
      c.vx = (c.vx + c.ax * dt) * f; c.vy = (c.vy + c.ay * dt) * f;
      c.cx += c.vx * dt; c.cy += c.vy * dt;
    }
    // Collisions: push overlapping circles apart and soak up the impact. Sweep and
    // prune: sorted by left edge, each circle only checks those starting before its right edge.
    for (const c of bodies) c.lx = c.cx - c.r;
    bodies.sort((p, q) => p.lx - q.lx);
    const m = bodies.length;
    for (let i = 0; i < m; i++) {
      const a = bodies[i], right = a.cx + a.r;
      for (let j = i + 1; j < m; j++) {
        const b = bodies[j];
        if (b.lx > right) break;
        const sol = a.solid * b.solid;
        if (sol <= 0) continue;                   // fully permeable: they pass through each other
        const dx = b.cx - a.cx, dy = b.cy - a.cy, min = a.r + b.r;
        if (Math.abs(dy) >= min) continue;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d >= min || d === 0) continue;
        // Mass ~ r², scaled by the bigger circle so tiny circles never underflow.
        const s = a.r > b.r ? a.r : b.r, ma = (a.r / s) ** 2, mb = (b.r / s) ** 2, tot = ma + mb;
        // Partly permeable circles sink into each other and are eased apart: both the
        // push-out and the bounce are scaled by solidity. It's set as a rate per
        // second, so it feels the same at any sub-step count; fully solid (1) is
        // exactly the old hard collision.
        const push = sol >= 1 ? 1 : 1 - Math.pow(1 - sol, dt * SOFT_RATE);
        const ux = dx / d, uy = dy / d, overlap = (min - d) * push;
        a.cx -= ux * overlap * mb / tot; a.cy -= uy * overlap * mb / tot;
        b.cx += ux * overlap * ma / tot; b.cy += uy * overlap * ma / tot;
        const rel = (b.vx - a.vx) * ux + (b.vy - a.vy) * uy;
        if (rel < 0) {
          const e = (1 + RESTITUTION) * rel * push;
          const ja = e * mb / tot, jb = e * ma / tot;
          a.vx += ja * ux; a.vy += ja * uy;
          b.vx -= jb * ux; b.vy -= jb * uy;
        }
      }
    }
    collideLines(bodies);
  }

  // Keep circles on their side of every line: push out and bounce off.
  function collideLines(bodies) {
    for (const st of strokes) {
      const p = st.pts, half = st.w / 2, [bx0, by0, bx1, by1] = strokeBox(st), ch = st.chunks;
      for (const c of bodies) {
        const reach = c.r + half;
        if (c.cx < bx0 - reach || c.cx > bx1 + reach || c.cy < by0 - reach || c.cy > by1 + reach) continue;
        for (let k = 0; k < ch.length; k += 6) {
          if (c.cx < ch[k + 2] - reach || c.cx > ch[k + 4] + reach || c.cy < ch[k + 3] - reach || c.cy > ch[k + 5] + reach) continue;
          for (let i = ch[k]; i + 3 < ch[k + 1]; i += 2) {
            const ax = p[i], ay = p[i + 1], ex = p[i + 2] - ax, ey = p[i + 3] - ay;
            const len2 = ex * ex + ey * ey;
            let t = len2 ? ((c.cx - ax) * ex + (c.cy - ay) * ey) / len2 : 0;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const qx = ax + ex * t, qy = ay + ey * t;
            let nx = c.cx - qx, ny = c.cy - qy, d = Math.hypot(nx, ny);
            if (d >= reach) continue;
            if (d === 0) { nx = -ey; ny = ex; d = Math.hypot(nx, ny) || 1; }
            nx /= d; ny /= d;
            c.cx = qx + nx * reach; c.cy = qy + ny * reach;
            const vn = (c.vx || 0) * nx + (c.vy || 0) * ny;
            if (vn < 0) { c.vx -= (1 + RESTITUTION) * vn * nx; c.vy -= (1 + RESTITUTION) * vn * ny; }
          }
        }
      }
    }
  }

  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(text) {
    toastEl.textContent = text; toastEl.style.opacity = '1';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.opacity = '0', 1400);
  }
  function toggleForces() {
    forcesOn = !forcesOn;
    if (!forcesOn) for (const c of circles) { c.vx = 0; c.vy = 0; }
    toast(forcesOn ? 'Colour forces on' : 'Colour forces off');
    if (navigator.vibrate) navigator.vibrate([20, 60, 20]);
  }

  // Each dot now and then drops a coloured circle its own size, with a small
  // push in a random direction, while forces are on.
  function emit(dt) {
    for (const d of dots) {
      d.wait -= dt;
      if (d.wait > 0) continue;
      d.wait = emitWait();
      const ok = d.big ? isFinite(d.ox) && isFinite(d.oy) : isFinite(d.cx) && isFinite(d.cy);
      if (!ok || !isFinite(d.r)) continue;          // only if the view itself has overflowed
      const h = Math.floor(Math.random() * 360);   // any hue, the background's included
      const a = Math.random() * Math.PI * 2, v = d.r * (1.5 + Math.random() * 2);
      const c = d.big
        ? { big: true, ox: d.ox, oy: d.oy, nx: d.nx, ny: d.ny, r: d.r }   // huge: same edge-anchored form as the dot
        : { cx: d.cx + Math.cos(a) * d.r * 0.05, cy: d.cy + Math.sin(a) * d.r * 0.05, r: d.r };
      c.hue = h; c.color = hsl(h); c.vx = Math.cos(a) * v; c.vy = Math.sin(a) * v;
      circles.push(c);
      history.push({ type: 'circle', obj: c });
    }
  }

  // Fill a circle (small or big form), skipping it if it's off screen.
  function fillDisc(c, ctx = mainCtx) {
    const sx = W / 2, sy = H / 2, diag = Math.hypot(W, H);
    if (!c.big) {
      const d = Math.hypot(c.cx - sx, c.cy - sy);
      if (d - c.r > diag) return false;                                   // off screen
      if (c.r - d > diag) { ctx.fillRect(0, 0, W, H); return false; }    // covers screen
      ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2); ctx.fill();
      return true;
    }
    // So big its edge is a straight line on screen: fill that side.
    const inside = (sx - c.ox) * c.nx + (sy - c.oy) * c.ny;
    if (inside > diag) { ctx.fillRect(0, 0, W, H); return false; }
    if (inside < -diag) return false;
    const ux = -c.ny, uy = c.nx, B = diag * 2;
    ctx.beginPath();
    ctx.moveTo(c.ox + ux * B, c.oy + uy * B);
    ctx.lineTo(c.ox - ux * B, c.oy - uy * B);
    ctx.lineTo(c.ox - ux * B + c.nx * B, c.oy - uy * B + c.ny * B);
    ctx.lineTo(c.ox + ux * B + c.nx * B, c.oy + uy * B + c.ny * B);
    ctx.closePath(); ctx.fill();
    return false;
  }
  // A black dot with a thin light ring so it shows on any colour.
  function drawDot(c) {
    ctx.fillStyle = '#000';
    if (fillDisc(c) && c.r < 1e5) {
      ctx.lineWidth = Math.min(2, c.r * 0.25); ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // ----- Eating: a bigger circle covering more than half of a smaller one
  // removes it and clones itself (same size, colour and velocity), just
  // touching it on the side facing the circle it ate.
  const eatList = [];
  const clamp1 = (x) => x < -1 ? -1 : x > 1 ? 1 : x;
  // Fraction of the small disc (radius r) inside the big one (R > r), for
  // R - r < d < R. Worked out scale-free so tiny or huge sizes stay exact.
  function lensFrac(R, r, d) {
    if (r < 1e-6 * R) return d < R ? 1 : 0;          // big edge is straight at this scale
    r /= R; d /= R;
    const a1 = Math.acos(clamp1((d * d + r * r - 1) / (2 * d * r)));
    const a2 = Math.acos(clamp1((d * d + 1 - r * r) / (2 * d)));
    const tri = 0.5 * Math.sqrt(Math.max(0, (-d + r + 1) * (d + r - 1) * (d - r + 1) * (d + r + 1)));
    return (r * r * a1 + a2 - tri) / (Math.PI * r * r);
  }
  function cloneOf(p, extra) {
    const c = Object.assign({ r: p.r, color: p.color, vx: p.vx || 0, vy: p.vy || 0 }, extra);

                           : Math.hypot(x - c.cx, y - c.cy) <= c.r;
      if (inside) return c;
    }
    return null;
  }
  // Tap on a circle: give it a new hue. Tap on the background: change the background's hue.
  function handleTap(x, y) {
    const hit = circleAt(x, y);
    if (!hit) { nextHue(); return; }
    const h = hit.hue == null ? Math.floor(Math.random() * 360) : randomHue([hit.hue], 40);
    hit.hue = h; hit.color = hsl(h);
    dirty = true;
  }
  // Ends the press. A circle that was growing stops and stays on screen.
  function endPress(tap) {
    if (!press) return;
    clearTimeout(press.timer);
    cancelAnimationFrame(press.raf);
    if (press.stroke) finishStroke(press.stroke, tap);
    else if (!press.circle && tap) handleTap(press.x, press.y);
    press = null;
  }

  // ----- Touch: one finger presses, two fingers pinch to zoom and pan -----
  const touches = new Map(); // id -> {x, y}
  let pinch = null;          // {d, a, mx, my} from the previous frame
  let gestureUsed = false;   // true once a pinch happened, until every finger is up
  let twoHold = null;        // {timer, start} while two fingers rest still
  // Double tap with two fingers removes the last circle, line or dot. A
  // two-finger tap: both fingers land together, barely move and lift quickly.
  // While two fingers are down we remember the total zoom/pan/twist they caused
  // (as z -> A*z + B on complex numbers) so a tap can put the view back exactly.
  const TAP_MS = 350;        // first finger down to last finger up
  const TAP_LAND_MS = 150;   // second finger must land this soon after the first
  const TAP_MOVE = 20;       // max travel of each finger and of the midpoint, px
  const TAP_TURN = 0.25;     // max twist, radians
  const DOUBLE_GAP_MS = 450; // end of first tap to start of second
  const DOUBLE_NEAR = 80;    // second tap's midpoint within this of the first's
  let firstDownT = 0;        // when the first finger of the current touch landed
  let twoTap = null;         // {t0, ok, start, fingers, ar, ai, br, bi}
  let lastTwoTap = null;     // {t, mx, my}: the previous two-finger tap
  function trackTwoTap(k, px, py, dx, dy, a) {
    const tt = twoTap; if (!tt) return;
    const sr = k * Math.cos(a), si = k * Math.sin(a);                 // step A
    const tr = px - (sr * px - si * py) + dx, ti = py - (si * px + sr * py) + dy; // step B
    const ar = sr * tt.ar - si * tt.ai, ai = sr * tt.ai + si * tt.ar;
    const br = sr * tt.br - si * tt.bi + tr, bi = sr * tt.bi + si * tt.br + ti;
    tt.ar = ar; tt.ai = ai; tt.br = br; tt.bi = bi;
    if (!tt.ok) return;
    const now = pinchState(), s0 = tt.start;
    let turn = Math.abs(now.a - s0.a); if (turn > Math.PI) turn = 2 * Math.PI - turn;
    let moved = Math.hypot(now.mx - s0.mx, now.my - s0.my) > TAP_MOVE || Math.abs(now.d - s0.d) > TAP_MOVE || turn > TAP_TURN;
    for (const [id, p] of tt.fingers) { const q = touches.get(id); if (q && Math.hypot(q.x - p.x, q.y - p.y) > TAP_MOVE) moved = true; }
    if (moved) tt.ok = false;
  }
  function finishTwoTap(cancelled) {
    const tt = twoTap; twoTap = null;
    const now = performance.now();
    if (!tt || cancelled || !tt.ok || now - tt.t0 > TAP_MS) { lastTwoTap = null; return; }
    // Put back any tiny zoom/pan the tap caused: apply the inverse of z -> A*z + B.
    if (tt.ar !== 1 || tt.ai !== 0 || tt.br !== 0 || tt.bi !== 0) {
      const m2 = tt.ar * tt.ar + tt.ai * tt.ai;
      const ir = tt.ar / m2, ii = -tt.ai / m2;                       // 1/A
      const ibr = -(ir * tt.br - ii * tt.bi), ibi = -(ir * tt.bi + ii * tt.br); // -B/A
      transformAll(Math.hypot(ir, ii), 0, 0, ibr, ibi, Math.atan2(ii, ir));
    }
    const l = lastTwoTap;
    if (l && tt.t0 - l.t <= DOUBLE_GAP_MS && Math.hypot(tt.start.mx - l.mx, tt.start.my - l.my) <= DOUBLE_NEAR) {
      lastTwoTap = null;
      undoLast();
    } else lastTwoTap = { t: now, mx: tt.start.mx, my: tt.start.my };
  }
  const pts = () => [...touches.values()];
  function pinchState() {
    const [a, b] = pts();
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, a: Math.atan2(b.y - a.y, b.x - a.x),
             mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }

  const opts = { passive: false };
  document.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (touches.size === 0) firstDownT = performance.now();
    for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
    if (touches.size === 1 && !gestureUsed) {
      const t = e.changedTouches[0];
      if (onDock(t.clientX, t.clientY)) beginDot(t.identifier, t.clientX, t.clientY);
      else beginPress(t.identifier, t.clientX, t.clientY);
    } else if (touches.size >= 2) {
      endPress(false);          // a second finger means zoom, not a tap or hold
      endDot(false);
      gestureUsed = true;
      pinch = pinchState();
      cancelTwoHold();
      if (twoTap) twoTap.ok = false;   // a third finger: not a tap
      if (touches.size === 2) {
        twoTap = { t0: firstDownT, ok: performance.now() - firstDownT <= TAP_LAND_MS, start: pinch,
                   fingers: new Map([...touches].map(([id, p]) => [id, { x: p.x, y: p.y }])), ar: 1, ai: 0, br: 0, bi: 0 };
        twoHold = { start: pinch, timer: setTimeout(() => { twoHold = null; toggleForces(); }, FORCE_HOLD_MS) };
      }
    }
  }, opts);
  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (touches.has(t.identifier)) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
      movePress(t.identifier, t.clientX, t.clientY);
      moveDot(t.identifier, t.clientX, t.clientY);
    }
    if (pinch && touches.size >= 2) {
      const now = pinchState();
      let da = now.a - pinch.a;               // twist between frames, kept within ±180°
      if (da > Math.PI) da -= 2 * Math.PI; else if (da < -Math.PI) da += 2 * Math.PI;
      const step = [now.d / pinch.d, pinch.mx, pinch.my, now.mx - pinch.mx, now.my - pinch.my, da];
      transformAll(...step);
      trackTwoTap(...step);
      pinch = now;
      if (twoHold) {             // moving the fingers means pinching, not holding
        const s0 = twoHold.start;
        let turn = Math.abs(now.a - s0.a); if (turn > Math.PI) turn = 2 * Math.PI - turn;
        if (Math.abs(now.d - s0.d) > 14 || Math.hypot(now.mx - s0.mx, now.my - s0.my) > 14 || turn > 0.12) cancelTwoHold();
      }
    }
  }, opts);
  function cancelTwoHold() { if (twoHold) { clearTimeout(twoHold.timer); twoHold = null; } }
  function liftTouches(e, cancelled) {
    cancelTwoHold();
    for (const t of e.changedTouches) {
      touches.delete(t.identifier);
      if (press && press.id === t.identifier) endPress(!cancelled && !gestureUsed);
      if (dotDrag && dotDrag.id === t.identifier) endDot(!cancelled);
    }
    if (twoTap && (cancelled || touches.size === 0)) finishTwoTap(cancelled);
    pinch = touches.size >= 2 ? pinchState() : null;
    if (touches.size === 0) gestureUsed = false;
  }
  document.addEventListener('touchend', (e) => { e.preventDefault(); liftTouches(e, false); }, opts);
  document.addEventListener('touchcancel', (e) => liftTouches(e, true), opts);

  // ----- Mouse (desktop): click/hold like a finger, scroll wheel to zoom -----
  const isMouse = (e) => e.pointerType !== 'touch';
  document.addEventListener('pointerdown', (e) => {
    if (!isMouse(e)) return;
    if (onDock(e.clientX, e.clientY)) beginDot('m', e.clientX, e.clientY); else beginPress('m', e.clientX, e.clientY);
  });
  document.addEventListener('pointermove', (e) => { if (isMouse(e)) { movePress('m', e.clientX, e.clientY); moveDot('m', e.clientX, e.clientY); } });
  document.addEventListener('pointerup', (e) => { if (isMouse(e)) { endPress(true); endDot(true); } });
  document.addEventListener('pointercancel', (e) => { if (isMouse(e)) { endPress(false); endDot(false); } });
  document.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.shiftKey) transformAll(1, e.clientX, e.clientY, 0, 0, (e.deltaY || e.deltaX) * 0.003); // Shift + scroll rotates
    else transformAll(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY, 0, 0);
  }, { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // For testing: window.__hue exposes state.
  window.__hue = { circles, strokes, dots, hunters, pops, history, transformAll, get dock() { return { x: dockX, y: dockY, r: DOT_R }; },
    get redDock() { return { x: redX, y: redY, r: HUNTER_R }; }, get hue() { return hue; }, set hue(h) { hue = h; paint(); }, get forcesOn() { return forcesOn; } };
</script>
</body>
</html>
