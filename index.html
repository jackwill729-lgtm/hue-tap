<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3ccfd9">
<title>Hue Tap</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  body{background:hsl(200,70%,55%);transition:background-color .35s ease;cursor:pointer}
  .circle{position:fixed;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);
    background:#fff;pointer-events:none}
</style>
</head>
<body>
<script>
  const HOLD_MS = 500;         // how long to hold before the circle appears
  const GROW_PX_PER_S = 160;   // how fast the circle's radius grows

  let hue = Math.floor(Math.random() * 360);
  const theme = document.querySelector('meta[name=theme-color]');
  function paint() {
    const c = `hsl(${hue},70%,55%)`;
    document.body.style.backgroundColor = c;
    theme.setAttribute('content', c);
  }
  function nextHue() {
    hue = (hue + 40 + Math.floor(Math.random() * 240)) % 360;
    paint();
  }
  paint();

  // One active press at a time.
  let press = null; // {id, x, y, timer, circle, start, raf}

  function startCircle() {
    const el = document.createElement('div');
    el.className = 'circle';
    el.style.left = press.x + 'px';
    el.style.top = press.y + 'px';
    document.body.appendChild(el);
    press.circle = el;
    press.start = performance.now();
    const grow = (now) => {
      if (!press || press.circle !== el) return;
      const r = ((now - press.start) / 1000) * GROW_PX_PER_S;
      el.style.width = el.style.height = (2 * r) + 'px';
      press.raf = requestAnimationFrame(grow);
    };
    press.raf = requestAnimationFrame(grow);
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function endPress(id, cancelled) {
    if (!press || id !== press.id) return;
    clearTimeout(press.timer);
    cancelAnimationFrame(press.raf);
    if (press.circle) {
      // Held long enough: the circle stops growing and stays on screen.
    } else if (!cancelled) {
      // Short tap: change the colour.
      nextHue();
    }
    press = null;
  }
  function beginPress(id, x, y) {
    if (press) return;
    press = { id, x, y, circle: null };
    press.timer = setTimeout(startCircle, HOLD_MS);
  }
  function movePress(id, x, y) {
    if (press && id === press.id && !press.circle) { press.x = x; press.y = y; }
  }

  // Touch screens: use touch events and block the browser's own long-press
  // behaviour (text selection, magnifier, context menu) so it can't steal the hold.
  const opts = { passive: false };
  document.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    beginPress('t' + t.identifier, t.clientX, t.clientY);
  }, opts);
  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) movePress('t' + t.identifier, t.clientX, t.clientY);
  }, opts);
  document.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) endPress('t' + t.identifier, false);
  }, opts);
  document.addEventListener('touchcancel', (e) => {
    for (const t of e.changedTouches) endPress('t' + t.identifier, true);
  }, opts);

  // Mouse and pen (desktop).
  document.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') beginPress('p' + e.pointerId, e.clientX, e.clientY); });
  document.addEventListener('pointermove', (e) => { if (e.pointerType !== 'touch') movePress('p' + e.pointerId, e.clientX, e.clientY); });
  document.addEventListener('pointerup', (e) => { if (e.pointerType !== 'touch') endPress('p' + e.pointerId, false); });
  document.addEventListener('pointercancel', (e) => { if (e.pointerType !== 'touch') endPress('p' + e.pointerId, true); });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
