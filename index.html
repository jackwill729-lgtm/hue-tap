<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3ccfd9">
<title>Hue Tap</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  body{background:hsl(200,70%,55%);transition:background-color .35s ease;cursor:pointer}
  .circle{position:fixed;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);
    background:#fff;pointer-events:none;transition:opacity .6s ease}
</style>
</head>
<body>
<script>
  const HOLD_MS = 2000;        // how long to hold before the circle appears
  const GROW_PX_PER_S = 320;   // how fast the circle's radius grows

  let hue = Math.floor(Math.random() * 360);
  const theme = document.querySelector('meta[name=theme-color]');
  function paint() {
    const c = `hsl(${hue},70%,55%)`;
    document.body.style.backgroundColor = c;
    theme.setAttribute('content', c);
  }
  function nextHue() {
    hue = (hue + 40 + Math.floor(Math.random() * 240)) % 360;
    paint();
  }
  paint();

  // One active press at a time.
  let press = null; // {id, x, y, timer, circle, start, raf}

  function startCircle() {
    const el = document.createElement('div');
    el.className = 'circle';
    el.style.left = press.x + 'px';
    el.style.top = press.y + 'px';
    document.body.appendChild(el);
    press.circle = el;
    press.start = performance.now();
    const grow = (now) => {
      if (!press || press.circle !== el) return;
      const r = ((now - press.start) / 1000) * GROW_PX_PER_S;
      el.style.width = el.style.height = (2 * r) + 'px';
      press.raf = requestAnimationFrame(grow);
    };
    press.raf = requestAnimationFrame(grow);
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function endPress(e, cancelled) {
    if (!press || e.pointerId !== press.id) return;
    clearTimeout(press.timer);
    cancelAnimationFrame(press.raf);
    if (press.circle) {
      // Held long enough: stop growing, then fade the circle away.
      const el = press.circle;
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 700);
    } else if (!cancelled) {
      // Short tap: change the colour.
      nextHue();
    }
    press = null;
  }

  document.addEventListener('pointerdown', (e) => {
    if (press) return;
    document.body.setPointerCapture?.(e.pointerId);
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, circle: null };
    press.timer = setTimeout(startCircle, HOLD_MS);
  });
  document.addEventListener('pointermove', (e) => {
    if (press && e.pointerId === press.id && !press.circle) { press.x = e.clientX; press.y = e.clientY; }
  });
  document.addEventListener('pointerup', (e) => endPress(e, false));
  document.addEventListener('pointercancel', (e) => endPress(e, true));
  document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
