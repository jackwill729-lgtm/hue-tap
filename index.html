<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3ccfd9">
<title>Hue Tap</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  body{background:hsl(170,70%,55%);transition:background-color .35s ease;cursor:pointer}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font:600 15px/1 -apple-system,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:10px 16px;
    border-radius:20px;opacity:0;transition:opacity .4s;pointer-events:none}
  #score{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);
    font:600 14px/1 -apple-system,system-ui,sans-serif;color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap}
  #best{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);
    font:600 11px/1 -apple-system,system-ui,sans-serif;color:#fff;opacity:.55;text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap;
    transition:color .4s,opacity .4s}
  #best.hi{color:#FFD54A;opacity:1}
  #overBest{display:block;font-size:14px;opacity:.9}
  #overBest i{font-style:normal;color:#FFD54A;margin-left:6px}
  #over{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;white-space:nowrap;width:max-content;
    font:600 16px/1.4 -apple-system,system-ui,sans-serif;background:rgba(0,0,0,.5);padding:22px 30px;border-radius:22px;display:none}
  #over b{display:block;font-size:30px;margin-bottom:6px}
  #over small{display:block;margin-top:10px;font-size:14px;opacity:.85}
  #bar{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:2}
  #bar button{font:600 13px/1 -apple-system,system-ui,sans-serif;color:#fff;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}
  #bar button:focus{outline:none}
  #modeBtn{display:flex;padding:3px;border-radius:16px;background:rgba(0,0,0,.35)}
  #modeBtn span{padding:7px 12px;border-radius:13px;opacity:.75}
  #modeBtn span.on{background:#fff;color:#222;opacity:1}
  #penBtn{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:17px;background:rgba(0,0,0,.35);font-size:17px!important;padding:0}
  #penBtn.on{background:#fff;color:#222!important;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
  #diceBtn{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:32px;height:32px;border-radius:16px;background:rgba(0,0,0,.35);font-size:18px!important;padding:0;line-height:32px!important}
  #runBtn{position:absolute;left:calc(50% + 24px);top:calc(100% + 8px);width:32px;height:32px;border-radius:16px;background:rgba(0,0,0,.35);padding:0;font-size:13px!important;line-height:32px!important;letter-spacing:-2px}
  #runBtn.on{background:#fff;color:#222!important;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
  #fps{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);font:500 11px/1 -apple-system,system-ui,sans-serif;
    color:rgba(255,255,255,.7);text-shadow:0 0 3px rgba(0,0,0,.45);pointer-events:none;z-index:2;white-space:nowrap}
  #hint{position:fixed;left:50%;bottom:calc(68px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 140px);
    text-align:center;font:500 13px/1.45 -apple-system,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.35);padding:8px 14px;
    border-radius:16px;opacity:0;transition:opacity .5s;pointer-events:none;width:max-content}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="o"></canvas>
<div id="toast"></div>
<div id="score"></div>
<div id="best"></div>
<div id="bar"><button id="penBtn" title="Pencil: drag draws lines (L)" aria-pressed="false">✎</button><button id="modeBtn" title="Switch Edit / Play (Tab)"><span id="mEdit" class="on">Edit</span><span id="mPlay">Play</span></button><button id="diceBtn" title="Scatter random spawners over the world (X)" aria-label="Random spawners">🎲</button><button id="runBtn" title="Run / pause the world while editing (T)" aria-label="Run" aria-pressed="false">▶</button></div>
<div id="fps"></div>
<div id="hint"></div>
<div id="over"><b>Game over</b><span id="overScore"></span><span id="overBest"></span><small>Tap to play again</small></div>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>
<script>
  const HOLD_MS = 500;         // how long to hold before a circle appears
  const GROW_PX_PER_S = 160;   // how fast a circle's radius grows, in screen pixels
  const FORCE_HOLD_MS = 2000;  // two-finger hold that switches colour forces on or off
  const DRAG_PX = 10;          // finger travel that turns a press into drawing a line
  const LINE_WIDTH = 6;        // new lines' thickness, in screen pixels
  const LINE_COLOR = '#FFFFFF';
  const DOT_R = 10;            // the black dot in the corner, and new dots, in screen pixels
  const DOT_HIT = 28;          // how close a finger must start to the corner dot to drag it
  const DOCK_GAP = 52;         // spawner docks sit this far from the hunter / chaser docks
  const GRAB_R = 20;           // Edit: small things can be grabbed this far from their centre
  const HUNTER_R = 8;          // the red dot in the other corner, and new hunters, in screen pixels
  const HUNTER_SPEED = 25;     // hunter radii per second, so it looks the same at any zoom
  const CHASER_R = 8;          // the blue dot in the top corner, and new chasers
  const CHASER_SPEED = 25;     // chaser radii per second: the same as hunters
  let FLEE_RANGE = 12;         // hunters run from chasers closer than this many hunter radii (tests may set 0)
  const POP_S = 0.25;          // length of the pop animation
  const CLONE_EVERY = 20;      // a hunter clones itself every this many pops
  const DOT_FLEE_RANGE = 150;  // black dots run from anything whose edge is within this (px at the starting zoom)
  const DOT_FLEE_SPEED = 100;  // their top speed, px/s at the starting zoom: about a fleeing coloured circle's
  const DOT_DAMPING = 2.5;     // per second, so they settle soon after the danger has gone
  const DOT_OWN_MS = 1000;     // a dot ignores circles it released this recently
  const DOT_AGE_S = 60;        // a black dot's circles grow by their base size every this many seconds it has been running
  const EMIT_MEAN_S = 1.2;     // average time between circles from one dot while forces are on
  const FRAME_BUDGET_MS = 12;  // physics time per frame; beyond this the simulation slows rather than freezes
  const SPAWNER_R = 10;        // red / blue spawners dragged from the corners, in screen pixels
  const SPAWNER_MEAN_S = 30;   // average time between hunters / chasers from one spawner while forces are on (very rare)
  const EMIT_MIN = 0.6, EMIT_MAX = 1.6;   // emitted circles: this range times the dot's radius
  const SPAWN_R = 0.8;         // spawned hunters and chasers: this fraction of the spawner's radius
  const CIRCLE_FLEE_ACCEL = 15;  // coloured circles run from hunters: hunter radii/s² at point-blank range
  const PLAYER_R = 12;         // the white player dot's starting radius, in screen pixels
  const TILT_DEAD = 3;         // degrees of tilt that do nothing
  const TILT_FULL = 30;        // degrees of tilt for full speed
  const TILT_MAX_RADII = 37.5; // top speed in player start radii per second (450 px/s at normal zoom)
  const TILT_SMOOTH_S = 0.08;  // smoothing time constant for the player's speed
  const INVULN_MS = 2000;      // blinking safe time after a restart (longer while a bigger circle still covers the spot)
  const NEUTRAL_MS = 300;      // tilt readings averaged for the neutral pose after load/restart

  // ----- Colour -----
  // The background and every tapped circle each have their own hue, and no two
  // ever share one. New circles start white (no hue) until they're tapped.
  const WHITE = '#FFFFFF';
  const hsl = (h) => `hsl(${h},70%,55%)`;
  const hueGap = (a, b) => { const d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); };
  // Circles may share colours (identical hues repel each other the hardest).
  // A random whole-degree hue at least `minGap` degrees from every hue in `avoid`
  // (so a tap's change is easy to see).
  function randomHue(avoid, minGap) {
    for (let tries = 0; tries < 100; tries++) {
      const h = Math.floor(Math.random() * 360);
      if (avoid.every(a => a == null || hueGap(h, a) >= minGap)) return h;
    }
    return Math.floor(Math.random() * 360);
  }
  let hue = Math.floor(Math.random() * 360);
  const theme = document.querySelector('meta[name=theme-color]');
  function paint() {
    document.body.style.backgroundColor = hsl(hue);
    theme.setAttribute('content', hsl(hue));
  }
  function nextHue() {
    hue = randomHue([hue], 40); paint();
  }
  paint();

  // ----- Circles, stored in screen coordinates so zoom has no limits -----
  // Every zoom or pan is applied directly to each circle. Small circles keep a
  // centre point. Huge ones (bigger than BIG) are kept as "the point on the edge
  // nearest the screen, plus the direction to the centre", re-anchored every
  // frame, so their edges stay sharp however far you zoom in.
  const BIG = 2e6, SMALL = 1e6;
  const circles = [];  // {cx, cy, r, color, hue} or {big:true, ox, oy, nx, ny, r, color, hue}
  // Lines: pts is a flat [x0, y0, x1, y1, ...] smoothed polyline in screen
  // coordinates, w its thickness. raw holds the finger points while drawing.
  const strokes = [];
  // Black dots dragged out of the corner. Stored like circles (same small/big
  // forms) so they zoom and turn with everything else; they emit coloured
  // circles while forces are on. wait = seconds until the next one.
  const dots = [];     // {cx, cy, r, wait} or the big form
  const emitWait = () => -Math.log(1 - Math.random()) * EMIT_MEAN_S;
  const emitStats = { circle: 0, hunter: 0, chaser: 0 };   // what dots and spawners have released (for tests)
  // Red and blue spawners dragged out of those corners: static like black dots
  // (same small/big forms), releasing hunters (red) or chasers (blue) while forces are on.
  const spawners = [];  // {cx, cy, r, kind: 'hunter' | 'chaser', wait} or the big form
  function addHunter(x, y, r = HUNTER_R) { const h = { cx: x, cy: y, r, popCount: 0 }; hunters.push(h); history.push({ type: 'hunter', obj: h }); return h; }
  function addChaser(x, y, r = CHASER_R) { const c = { cx: x, cy: y, r }; chasers.push(c); history.push({ type: 'chaser', obj: c }); return c; }
  const CHASER_EVERY = 3;     // a chaser comes out for every this many spawned hunters
  let spawnedHunters = 0;     // hunters born this run: spawner releases and clones (not dock-placed)
  const spawnWait = () => -Math.log(1 - Math.random()) * SPAWNER_MEAN_S;
  // Red hunters dragged out of the other corner: same small/big forms as circles.
  // Each one chases the nearest circle and pops it.
  const hunters = [];  // {cx, cy, r} or the big form
  const pops = [];     // {x, y, r, color, t0}: pop animations, in screen coordinates
  // Blue chasers dragged out of the top corner: they go after hunters.
  const chasers = [];  // {cx, cy, r} or the big form
  // The player: a white dot pinned to the screen centre. Tilting moves the world
  // the other way, so the dot seems to travel. Eating a smaller circle grows it by a
  // tenth of that circle's radius, a hunter catching it shrinks it by 15%, and a
  // bigger circle covering it ends the game. The reading at the top is its size as a
  // % of its start size (no points); in Play the view zooms to keep it 12 px on screen. invUntil = end of the blinking
  // safe time after a restart; huntSafeUntil = end of the 1 s safe time after a catch.
  // Two modes. Edit: a level editor with the world frozen (navigate, place and move
  // things). Play: the world runs, the player dot appears and the game rules apply.
  let mode = 'edit';
  let simInEdit = false;     // test hook: run the world while editing (the old all-in-one sandbox, with the player)
  let editRun = false;       // Edit's Run / Pause: the world runs as in Play, but with no player
  let pencil = false;        // Edit: a one-finger drag on empty space draws a line instead of panning
  let playerWanted = true;   // tests can switch the player off
  let playerOn = false;      // the player is in the game right now (Play, or the test sandbox)
  // scale = zoom since the player (re)started, so its speed scales with zoom like a hunter's;
  // guard = after a restart, stay safe until no bigger circle covers the player.
  // size is always 1 (kept for anything reading the old field).
  const player = { cx: 0, cy: 0, r: PLAYER_R, scale: 1, eaten: 0, peak: 1, caught: 0, size: 1, sizeT: 0, over: false, invUntil: 0, guard: false, huntSafeUntil: 0, vx: 0, vy: 0 };
  const history = [];  // circles, lines, dots, hunters and chasers in the order they were made, for undo
  function undoLast() {
    while (history.length) {
      const item = history.pop();
      if (item.type === 'batch') {             // the random spawners: one press, one undo
        let n = 0;
        for (const it of item.items) { const l = it.type === 'dot' ? dots : spawners, i = l.indexOf(it.obj); if (i >= 0) { l.splice(i, 1); n++; } }
        if (!n) continue;
        dirty = true; toast('Removed random spawners');
        if (navigator.vibrate) navigator.vibrate(10);
        return;
      }
      const list = { circle: circles, dot: dots, hunter: hunters, chaser: chasers, line: strokes,
                     hunterSpawner: spawners, chaserSpawner: spawners }[item.type];
      const i = list.indexOf(item.obj);
      if (i < 0) continue;
      list.splice(i, 1);
      dirty = true;
      toast({ circle: 'Removed circle', dot: 'Removed dot', hunter: 'Removed hunter', chaser: 'Removed chaser', line: 'Removed line',
              hunterSpawner: 'Removed hunter spawner', chaserSpawner: 'Removed chaser spawner' }[item.type]);
      if (navigator.vibrate) navigator.vibrate(10);
      return;
    }
    toast('Nothing to remove');
  }

  // Smooth a flat point list with Chaikin corner-cutting, keeping both ends.
  function smooth(raw, passes) {
    let p = raw;
    for (let n = 0; n < passes; n++) {
      if (p.length < 6) break;
      const q = [p[0], p[1]];
      for (let i = 0; i + 3 < p.length; i += 2) {
        const x0 = p[i], y0 = p[i + 1], x1 = p[i + 2], y1 = p[i + 3];
        q.push(0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1, 0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1);
      }
      q.push(p[p.length - 2], p[p.length - 1]);
      p = q;
    }
    return p;
  }
  // Bounding box of a line, plus boxes for each run of CHUNK segments so
  // collisions only look closely at the parts of a line near a circle.
  const CHUNK = 16;
  function strokeBox(st) {
    if (!st.box) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const p = st.pts, chunks = [];
      for (let s = 0; s < p.length; s += 2 * CHUNK) {
        let cx0 = Infinity, cy0 = Infinity, cx1 = -Infinity, cy1 = -Infinity;
        const end = Math.min(p.length, s + 2 * CHUNK + 2);
        for (let i = s; i < end; i += 2) {
          const x = p[i], y = p[i + 1];
          if (x < cx0) cx0 = x; if (x > cx1) cx1 = x; if (y < cy0) cy0 = y; if (y > cy1) cy1 = y;
        }
        chunks.push(s, end, cx0, cy0, cx1, cy1);
        if (cx0 < x0) x0 = cx0; if (cx1 > x1) x1 = cx1; if (cy0 < y0) y0 = cy0; if (cy1 > y1) y1 = cy1;
      }
      st.box = [x0, y0, x1, y1];
      st.chunks = chunks;
    }
    return st.box;
  }
  let W = innerWidth, H = innerHeight;
  const canvas = document.getElementById('c');
  let ctx = canvas.getContext('2d');   // let: Edit's tiled view draws the world into a tile through it
  const mainCtx = ctx;
  // The corner dot sits 32px in from the bottom-left, clear of any notch or home bar.
  const safeProbe = document.getElementById('safe');
  let dockX = 32, dockY = H - 32, redX = W - 32, redY = H - 32, blueX = 32, blueY = 32;
  const overlay = document.getElementById('o');   // flashing red dots and pops, redrawn every frame
  let octx = overlay.getContext('2d');
  const MAX_DPR = 2;
  function resize() {
    W = innerWidth; H = innerHeight;
    const cs = getComputedStyle(safeProbe);
    dockX = 32 + (parseFloat(cs.paddingLeft) || 0);
    dockY = H - 32 - (parseFloat(cs.paddingBottom) || 0);
    redX = W - 32 - (parseFloat(cs.paddingRight) || 0); redY = dockY;
    blueX = dockX; blueY = 32 + (parseFloat(cs.paddingTop) || 0);       // below any notch or status bar
    // v38: at most 2 canvas pixels per screen pixel. Phones at 2.6-3x paid 1.7-2.25x the
    // pixels (memory and fill time) for a barely visible difference.
    const d = Math.min(MAX_DPR, devicePixelRatio || 1);
    canvas.width = Math.round(W * d); canvas.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    overlay.width = canvas.width; overlay.height = canvas.height;
    octx.setTransform(d, 0, 0, d, 0, 0);
    dirty = true;
  }

  // Rotate everything by angle a (radians) and scale by k around screen point
  // (px, py), then move by (dx, dy).
  function transformAll(k, px, py, dx, dy, a = 0) {
    // Play: zooming out stops once the world just fills the screen. Edit: no limit to
    // speak of (the world can shrink to a thousandth of a pixel, past which the numbers
    // would start to lose it). Zooming in has no limit.
    if (worldOn && k < 1) {
      const lo = mode === 'play' ? minScale() : MIN_WORLD_PX / Math.min(world.WX, world.WY);
      if (world.s * k < lo) k = Math.min(1, lo / world.s);
    }
    world.s *= k; world.a += a;
    { const x = world.ox - px, y = world.oy - py, c = Math.cos(a) * k, s = Math.sin(a) * k;
      world.ox = px + x * c - y * s + dx; world.oy = py + x * s + y * c + dy; }
    const cos = Math.cos(a) * k, sin = Math.sin(a) * k;
    const cs = Math.cos(a), sn = Math.sin(a);
    for (const c of circles.concat(dots, hunters, chasers, spawners)) {
      if (c.big) {
        const x = c.ox - px, y = c.oy - py;
        c.ox = px + x * cos - y * sin + dx; c.oy = py + x * sin + y * cos + dy;
        const nx = c.nx * cs - c.ny * sn, ny = c.nx * sn + c.ny * cs;
        c.nx = nx; c.ny = ny;
      } else {
        const x = c.cx - px, y = c.cy - py;
        c.cx = px + x * cos - y * sin + dx; c.cy = py + x * sin + y * cos + dy;
      }
      if (c.vx) { const vx = c.vx, vy = c.vy; c.vx = vx * cos - vy * sin; c.vy = vx * sin + vy * cos; }
      c.r *= k;
    }
    player.r *= k; player.scale *= k;
    for (const st of strokes) {
      for (const arr of [st.pts, st.raw]) {
        if (!arr) continue;
        for (let i = 0; i < arr.length; i += 2) {
          const x = arr[i] - px, y = arr[i + 1] - py;
          arr[i] = px + x * cos - y * sin + dx; arr[i + 1] = py + x * sin + y * cos + dy;
        }
      }
      st.w *= k; st.box = null;
    }
    normalise();
    updateWrap();
    dirty = true;
  }

  function normalise() {
    const sx = W / 2, sy = H / 2;
    for (const c of circles.concat(dots, hunters, chasers, spawners)) {
      if (!c.big && c.r > BIG) {
        let dx = sx - c.cx, dy = sy - c.cy, L = Math.hypot(dx, dy);
        if (L === 0) { dx = 1; dy = 0; L = 1; }
        c.big = true;
        c.ox = c.cx + dx / L * c.r; c.oy = c.cy + dy / L * c.r;
        c.nx = -dx / L; c.ny = -dy / L;
      } else if (c.big && c.r < SMALL) {
        c.big = false;
        c.cx = c.ox + c.nx * c.r; c.cy = c.oy + c.ny * c.r;
      }
      if (c.big) {
        // Slide the anchor along the edge to the point nearest the screen centre.
        const ux = -c.ny, uy = c.nx;
        const t = (sx - c.ox) * ux + (sy - c.oy) * uy;
        if (!isFinite(c.r)) { c.ox += ux * t; c.oy += uy * t; continue; }
        if (Math.abs(t) >= c.r) continue;
        const root = Math.sqrt((c.r - t) * (c.r + t));
        const sag = t * t / (c.r + root);
        c.ox += ux * t + c.nx * sag; c.oy += uy * t + c.ny * sag;
        let nx = c.nx * (1 - sag / c.r) - ux * (t / c.r), ny = c.ny * (1 - sag / c.r) - uy * (t / c.r);
        const L = Math.hypot(nx, ny); c.nx = nx / L; c.ny = ny / L;
      }
    }
  }

  // ----- The world: a torus six screens wide and six screens tall -----
  // Its size is fixed at load (6 × the screen at zoom 1) and it scales and turns with
  // the view, so it's always the same size relative to everything in it. There are
  // no walls: whatever leaves one edge comes back on the opposite one, and every
  // interaction (forces, bumps, eating, hunting, fleeing, lines) takes the short way
  // round. Each frame, everything is wrapped into the world-sized box centred on the
  // view, so what's on screen is always continuous; things near that box's edge are
  // also drawn on the far side. Zooming out stops once the world fills the screen.
  const WORLD_SCREENS = 6;       // the world is this many screens across, each way
  const WRAP_MAX = 1e12;         // deep zoom: wrapping pauses once the world is this many px across
  let worldOn = true;            // test hook: off = the old unbounded plane
  const world = { WX: 0, WY: 0, s: 1, a: 0, ox: 0, oy: 0 };   // size (load px), scale, angle, guide origin
  let WON = false, PXv = 0, PYv = 0, HPX = 0, HPY = 0, C1 = 1, S1 = 0, MX = 0, MY = 0;
  function initWorld() { world.WX = WORLD_SCREENS * W; world.WY = WORLD_SCREENS * H; world.s = 1; world.a = 0; recentreWorld(); }
  // The dashed guide (Edit) marks the edges of the world as first laid out around the view.
  function recentreWorld() {
    const c = Math.cos(world.a), s = Math.sin(world.a), hx = world.WX * world.s / 2, hy = world.WY * world.s / 2;
    world.ox = W / 2 - hx * c + hy * s; world.oy = H / 2 - hx * s - hy * c;
  }
  const MIN_WORLD_PX = 1e-3;     // Edit: the world can shrink to this many px across, no further

      for (let tries = 0; tries < 80; tries++) {   // the first spot with room, else the roomiest one tried
        const u = (Math.random() - 0.5) * PX, v = (Math.random() - 0.5) * PY;
        const x = sx + u * C1 - v * S1, y = sy + u * S1 + v * C1, g = clear(x, y, r);
        if (g > bestG) { bestG = g; best = [x, y]; }
        if (g >= RANDOM_GAP) break;
      }
      const [x, y] = best;
      let o;
      if (kind === 'dot') { o = { cx: x, cy: y, r, wait: emitWait(), age: 0 }; dots.push(o); }
      else { o = { cx: x, cy: y, r, kind: kind === 'hunterSpawner' ? 'hunter' : 'chaser', wait: spawnWait() }; spawners.push(o); }
      items.push({ type: kind, obj: o });
      taken.push([x, y, r]);
    }
    history.push({ type: 'batch', items });
    dirty = true;
    toast('Added random spawners');
    if (navigator.vibrate) navigator.vibrate(15);
  }

  // Back to a fresh start, as if the page had just loaded.
  function resetGame() {
    for (const a of [circles, strokes, dots, spawners, hunters, chasers, pops, history, fleeing]) a.length = 0;
    grid = null;
    forcesOn = mode === 'play';
    cancelTwoHold(); lastTwoTap = null; restartTap = null;
    if (dotDrag) dotDrag = null;
    spawnedHunters = 0;
    setRun(false);                   // Edit's world paused again
    hue = Math.floor(Math.random() * 360); paint();
    restart();                       // player in the middle, 100%, immune for a moment, tilt re-calibrates

    if (navigator.vibrate) navigator.vibrate([30, 50, 30, 50, 30]);
  }

  // ----- Touch: one finger presses, two fingers pinch to zoom and pan -----
  const touches = new Map(); // id -> {x, y}
  let pinch = null;          // {d, a, mx, my} from the previous frame
  let gestureUsed = false;   // true once a pinch happened, until every finger is up
  let twoHold = null;        // {timer, start} while two fingers rest still
  // Double tap with two fingers removes the last circle, line or dot. A
  // two-finger tap: both fingers land together, barely move and lift quickly.
  // While two fingers are down we remember the total zoom/pan/twist they caused
  // (as z -> A*z + B on complex numbers) so a tap can put the view back exactly.
  const TAP_MS = 350;        // first finger down to last finger up
  const TAP_LAND_MS = 150;   // second finger must land this soon after the first
  const TAP_MOVE = 20;       // max travel of each finger and of the midpoint, px
  const TAP_TURN = 0.25;     // max twist, radians
  const DOUBLE_GAP_MS = 450; // end of first tap to start of second
  const DOUBLE_NEAR = 80;    // second tap's midpoint within this of the first's
  let firstDownT = 0;        // when the first finger of the current touch landed
  let twoTap = null;         // {t0, ok, start, fingers, ar, ai, br, bi}
  let lastTwoTap = null;     // {t, mx, my}: the previous two-finger tap
  function trackTwoTap(k, px, py, dx, dy, a) {
    const tt = twoTap; if (!tt) return;
    const sr = k * Math.cos(a), si = k * Math.sin(a);                 // step A
    const tr = px - (sr * px - si * py) + dx, ti = py - (si * px + sr * py) + dy; // step B
    const ar = sr * tt.ar - si * tt.ai, ai = sr * tt.ai + si * tt.ar;
    const br = sr * tt.br - si * tt.bi + tr, bi = sr * tt.bi + si * tt.br + ti;
    tt.ar = ar; tt.ai = ai; tt.br = br; tt.bi = bi;
    if (!tt.ok) return;
    const now = pinchState(), s0 = tt.start;
    let turn = Math.abs(now.a - s0.a); if (turn > Math.PI) turn = 2 * Math.PI - turn;
    let moved = Math.hypot(now.mx - s0.mx, now.my - s0.my) > TAP_MOVE || Math.abs(now.d - s0.d) > TAP_MOVE || turn > TAP_TURN;
    for (const [id, p] of tt.fingers) { const q = touches.get(id); if (q && Math.hypot(q.x - p.x, q.y - p.y) > TAP_MOVE) moved = true; }
    if (moved) tt.ok = false;
  }
  function finishTwoTap(cancelled) {
    const tt = twoTap; twoTap = null;
    const now = performance.now();
    if (!tt || cancelled || !tt.ok || now - tt.t0 > TAP_MS) { lastTwoTap = null; return; }
    // Put back any tiny zoom/pan the tap caused: apply the inverse of z -> A*z + B.
    if (tt.ar !== 1 || tt.ai !== 0 || tt.br !== 0 || tt.bi !== 0) {
      const m2 = tt.ar * tt.ar + tt.ai * tt.ai;

    if (l && tt.t0 - l.t <= DOUBLE_GAP_MS && Math.hypot(tt.start.mx - l.mx, tt.start.my - l.my) <= DOUBLE_NEAR) {
      lastTwoTap = null;
      undoLast();
    } else lastTwoTap = { t: now, mx: tt.start.mx, my: tt.start.my };
  }
  const pts = () => [...touches.values()];
  function pinchState() {
    const [a, b] = pts();

  }

  const opts = { passive: false };
  let uiTouch = null;         // {id, el}: a finger on the Edit/Play pill or the pencil
  const uiButton = (e) => e.target && e.target.closest ? e.target.closest('#bar button') : null;
  document.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const ui = uiButton(e);
    if (ui && touches.size === 0 && !uiTouch && e.changedTouches.length === 1) { uiTouch = { id: e.changedTouches[0].identifier, el: ui }; return; }

      playTap = null;

  }

    cancelTwoHold();
    if (!cancelled) askTiltPermission();
    for (const t of e.changedTouches) {

      touches.delete(t.identifier);
      if (playTap && playTap.id === t.identifier) endPlayTap(!cancelled);
      if (restartTap === t.identifier) { restartTap = null; if (!cancelled && player.over) restart(); }
      if (press && press.id === t.identifier) endPress(!cancelled && !gestureUsed);
      if (dotDrag && dotDrag.id === t.identifier) endDot(!cancelled);
    }
    if (twoTap && (cancelled || touches.size === 0)) finishTwoTap(cancelled);

  document.addEventListener('touchend', (e) => { e.preventDefault(); liftTouches(e, false); }, opts);
  document.addEventListener('touchcancel', (e) => liftTouches(e, true), opts);

  // ----- Mouse (desktop): click/hold like a finger, scroll wheel to zoom -----
  const isMouse = (e) => e.pointerType !== 'touch';
  document.addEventListener('pointerdown', (e) => {
    if (!isMouse(e)) return;
    const ui = uiButton(e);
    if (ui) { uiMouse = ui; return; }
    mouseHeld = true; cursor = { x: e.clientX, y: e.clientY };
    if (playerOn && player.over) { restartTap = 'm'; tapRun = null; return; }
    if (mode !== 'edit') { playTap = { id: 'm', x0: e.clientX, y0: e.clientY, t0: performance.now() }; return; }
    if (onDock(e.clientX, e.clientY)) { tapRun = null; beginDot('m', e.clientX, e.clientY); } else beginPress('m', e.clientX, e.clientY);
  });
  document.addEventListener('pointermove', (e) => { if (isMouse(e)) {
    cursor = e.clientX >= 0 && e.clientY >= 0 && e.clientX <= W && e.clientY <= H ? { x: e.clientX, y: e.clientY } : null;
    if (playTap && playTap.id === 'm') dragOffTap(e.clientX, e.clientY);
    movePress('m', e.clientX, e.clientY); moveDot('m', e.clientX, e.clientY); } });
  let uiMouse = null;          // the button the mouse went down on
  document.addEventListener('pointerup', (e) => {
    if (!isMouse(e)) return;
    if (uiMouse) { const el = uiMouse; uiMouse = null; if (uiButton(e) === el) pressButton(el); return; }
    mouseHeld = false;
    askTiltPermission();
    if (restartTap === 'm') { restartTap = null; if (player.over) restart(); return; }
    if (playTap && playTap.id === 'm') { endPlayTap(true); return; }

  });
  document.addEventListener('pointercancel', (e) => { if (isMouse(e)) { mouseHeld = false; if (playTap && playTap.id === 'm') playTap = null; endPress(false); endDot(false); } });

  document.documentElement.addEventListener('mouseleave', () => { cursor = null; });
  addEventListener('mouseout', (e) => { if (!e.relatedTarget) cursor = null; });
  addEventListener('blur', () => { cursor = null; mouseHeld = false; });
  document.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (mode !== 'edit') return;           // Play: the view only moves with the player
    const px = playerOn ? W / 2 : e.clientX, py = playerOn ? H / 2 : e.clientY;
    if (e.shiftKey) transformAll(1, px, py, 0, 0, (e.deltaY || e.deltaX) * 0.003); // Shift + scroll rotates
    else transformAll(Math.exp(-e.deltaY * 0.0015), px, py, 0, 0);
  }, { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  // Arrow keys / WASD move the player at full speed; Enter or Space restarts after game over.
  const KEY_DIR = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down',
                    A: 'left', D: 'right', W: 'up', S: 'down' };
  addEventListener('keydown', (e) => {
    const k = KEY_DIR[e.key];
    const mod = e.ctrlKey || e.metaKey;
    if (k && !mod) { keys.add(k); e.preventDefault(); }
    else if ((e.key === 'Enter' || e.key === ' ') && playerOn && player.over) { restart(); e.preventDefault(); }
    // Keyboard versions of the touch gestures (handy on a laptop, harmless elsewhere).
    else if (e.key === 'Tab' && !mod && !e.altKey) { setMode(mode === 'edit' ? 'play' : 'edit'); e.preventDefault(); }
    // Keyboard versions of the touch gestures (Edit only).
    else if (((mod && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) || (e.key === 'Backspace' && !mod)) && mode === 'edit') { undoLast(); e.preventDefault(); }
    else if (mod || e.altKey || e.repeat) return;
    else if (e.key === 'e' || e.key === 'E') { setMode('edit'); e.preventDefault(); }
    else if (e.key === 'p' || e.key === 'P') { setMode('play'); e.preventDefault(); }
    else if ((e.key === 'r' || e.key === 'R') && mode === 'edit') { tapRun = null; resetGame(); e.preventDefault(); }
    else if ((e.key === 'l' || e.key === 'L') && mode === 'edit') { setPencil(!pencil); e.preventDefault(); }
    else if ((e.key === 'x' || e.key === 'X') && mode === 'edit') { randomSpawners(); e.preventDefault(); }
    else if ((e.key === 't' || e.key === 'T') && mode === 'edit' && !mod) { toggleRun(); e.preventDefault(); }
    else if (e.key === 'h' || e.key === 'H' || e.key === '?') { showHint(!hintOn, false); e.preventDefault(); }
  });
  addEventListener('keyup', (e) => { const k = KEY_DIR[e.key]; if (k) keys.delete(k); });
  addEventListener('blur', () => keys.clear());
  // Laptop help hint: shown for 6 s on load, H or ? toggles it.
  const hintEl = document.getElementById('hint');
  let hintOn = false, hintTimer = null;
  function showHint(on, auto) {
    hintOn = on; hintEl.style.opacity = on ? '1' : '0'; clearTimeout(hintTimer);
    if (on && auto) hintTimer = setTimeout(() => showHint(false, false), 6000);
  }
  const HINTS = { edit: 'drag to pan · drag objects to move · click colour · hold circle · L pencil · X random spawners · T run / pause · scroll zoom · Ctrl+Z undo · R reset · Tab play',
                  play: 'move cursor to steer · click to change background · Tab edit' };
  if (laptop) document.querySelector('#over small').textContent = 'Click or press Space to play again';

  // ----- Edit / Play -----
  const modeEls = { edit: document.getElementById('mEdit'), play: document.getElementById('mPlay') };
  const penEl = document.getElementById('penBtn'), diceEl = document.getElementById('diceBtn'), runEl = document.getElementById('runBtn');
  // Edit's Run / Pause. Kept while in Play; back in Edit the world runs or not as before.
  function setRun(on) {
    editRun = !!on; runEl.classList.toggle('on', editRun); runEl.setAttribute('aria-pressed', String(editRun));
    runEl.textContent = editRun ? '❚❚' : '▶'; runEl.setAttribute('aria-label', editRun ? 'Pause' : 'Run');
    lastT = performance.now(); dirty = true;
  }
  function toggleRun() {
    if (mode !== 'edit') return;
    setRun(!editRun); toast(editRun ? 'Running' : 'Paused');
  }
  function syncPlayer() {
    playerOn = playerWanted && (mode === 'play' || simInEdit);
    overEl.style.display = playerOn && player.over ? 'block' : 'none';
    dirty = true;
  }
  function setPencil(on) {
    pencil = !!on; penEl.classList.toggle('on', pencil); penEl.setAttribute('aria-pressed', String(pencil));
  }
  function setMode(m) {
    if (m !== 'edit' && m !== 'play') return;
    endPress(false); endDot(false); cancelTwoHold(); restartTap = null; playTap = null; tapRun = null; lastTwoTap = null;
    if (m !== mode) {
      mode = m;
      if (mode === 'play') {          // a fresh run on the world as it is
        // Edit may be zoomed out past Play's limit: straight back in to it, about the centre.
        if (worldOn && world.s < minScale()) transformAll(minScale() / world.s, W / 2, H / 2, 0, 0);
        forcesOn = true; restart(); keys.clear();
      } else {                        // freeze where it is
        forcesOn = false; player.vx = 0; player.vy = 0;
      }
      lastT = performance.now();
    }
    for (const k in modeEls) modeEls[k].classList.toggle('on', k === mode);
    penEl.style.display = mode === 'edit' ? '' : 'none';
    diceEl.style.display = mode === 'edit' ? '' : 'none';   // in Play the size reading sits there
    runEl.style.display = mode === 'edit' ? '' : 'none';

  }
  function pressButton(el) {
    if (el.blur) el.blur();
    if (el === diceEl) randomSpawners();
    else if (el === runEl) toggleRun();
    else if (el === penEl) { if (mode === 'edit') setPencil(!pencil); }
    else setMode(mode === 'edit' ? 'play' : 'edit');
  }
  hintEl.textContent = HINTS.edit;
  setMode('edit');

  // For testing: window.__hue exposes state.
  window.__hue = { circles, strokes, dots, hunters, chasers, spawners, pops, history, transformAll,
    // test hooks: add a hunter / chaser directly (the corners now place spawners)
    addHunter, addChaser, get dock() { return { x: dockX, y: dockY, r: DOT_R }; },
    get redDock() { return { x: redX, y: redY, r: HUNTER_R }; }, get blueDock() { return { x: blueX, y: blueY, r: CHASER_R }; },

    get mode() { return mode; }, set mode(m) { setMode(m); }, get pencil() { return pencil; }, set pencil(v) { setPencil(v); },
    get fleeRange() { return FLEE_RANGE; }, set fleeRange(v) { FLEE_RANGE = +v; },
    get simInEdit() { return simInEdit; }, set simInEdit(v) { simInEdit = !!v; syncPlayer(); }, set forcesOn(v) { forcesOn = !!v; }, get hue() { return hue; }, set hue(h) { hue = h; paint(); }, get forcesOn() { return forcesOn; },
    get player() { return { x: W / 2, y: H / 2, r: player.r, eaten: player.eaten, score: sizePct(), peak: Math.round(player.peak * 100), caught: player.caught, size: player.size, gameOver: player.over,

    get best() { return best; }, BEST_KEY,

    get steering() { return steering; }, get hintOn() { return hintOn; },

    get worldOn() { return worldOn; }, set worldOn(v) { worldOn = !!v; updateWrap(); },   // test hook: off = the old unbounded plane
