<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3ccfd9">
<title>Hue Tap</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  body{background:hsl(170,70%,55%);transition:background-color .35s ease;cursor:pointer}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font:600 15px/1 -apple-system,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:10px 16px;
    border-radius:20px;opacity:0;transition:opacity .4s;pointer-events:none}
  #score{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);
    font:600 14px/1 -apple-system,system-ui,sans-serif;color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap}
  #over{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;white-space:nowrap;width:max-content;
    font:600 16px/1.4 -apple-system,system-ui,sans-serif;background:rgba(0,0,0,.5);padding:22px 30px;border-radius:22px;display:none}
  #over b{display:block;font-size:30px;margin-bottom:6px}
  #over small{display:block;margin-top:10px;font-size:14px;opacity:.85}
  #hint{position:fixed;left:50%;bottom:calc(68px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 140px);
    text-align:center;font:500 13px/1.45 -apple-system,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.35);padding:8px 14px;
    border-radius:16px;opacity:0;transition:opacity .5s;pointer-events:none;width:max-content}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="o"></canvas>
<div id="toast"></div>
<div id="score"></div>
<div id="hint">Move cursor to steer · click colour · hold circle · drag line · scroll zoom · F forces · Ctrl+Z undo · R reset · H help</div>
<div id="over"><b>Game over</b><span id="overScore"></span><small>Tap to play again</small></div>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>
<script>
  const HOLD_MS = 500;         // how long to hold before a circle appears
  const GROW_PX_PER_S = 160;   // how fast a circle's radius grows, in screen pixels
  const FORCE_HOLD_MS = 2000;  // two-finger hold that switches colour forces on or off
  const DRAG_PX = 10;          // finger travel that turns a press into drawing a line
  const LINE_WIDTH = 6;        // new lines' thickness, in screen pixels
  const LINE_COLOR = '#FFFFFF';
  const DOT_R = 10;            // the black dot in the corner, and new dots, in screen pixels
  const DOT_HIT = 28;          // how close a finger must start to the corner dot to drag it
  const HUNTER_R = 8;          // the red dot in the other corner, and new hunters, in screen pixels
  const HUNTER_SPEED = 25;     // hunter radii per second, so it looks the same at any zoom
  const CHASER_R = 8;          // the blue dot in the top corner, and new chasers
  const CHASER_SPEED = 35;     // chaser radii per second: faster than hunters so they can catch them
  const FLEE_RANGE = 12;       // hunters run from chasers closer than this many hunter radii
  const POP_S = 0.25;          // length of the pop animation
  const CLONE_EVERY = 20;      // a hunter clones itself every this many pops
  const EMIT_MEAN_S = 1.2;     // average time between circles from one dot while forces are on
  const FRAME_BUDGET_MS = 12;  // physics time per frame; beyond this the simulation slows rather than freezes
  const SPAWNER_R = 10;        // red / blue spawners dragged from the corners, in screen pixels
  const SPAWNER_MEAN_S = 30;   // average time between hunters / chasers from one spawner while forces are on (very rare)
  const EMIT_MIN = 0.6, EMIT_MAX = 1.6;   // emitted circles: this range times the dot's radius
  const SPAWN_R = 0.8;         // spawned hunters and chasers: this fraction of the spawner's radius
  const CIRCLE_FLEE_ACCEL = 15;  // coloured circles run from hunters: hunter radii/s² at point-blank range
  const PLAYER_R = 12;         // the white player dot's starting radius, in screen pixels
  const TILT_DEAD = 3;         // degrees of tilt that do nothing
  const TILT_FULL = 30;        // degrees of tilt for full speed
  const TILT_MAX_RADII = 37.5; // top speed in player start radii per second (450 px/s at normal zoom)
  const TILT_SMOOTH_S = 0.08;  // smoothing time constant for the player's speed
  const INVULN_MS = 2000;      // blinking safe time after a restart (longer while a bigger circle still covers the spot)
  const NEUTRAL_MS = 300;      // tilt readings averaged for the neutral pose after load/restart

  // ----- Colour -----
  // The background and every tapped circle each have their own hue, and no two
  // ever share one. New circles start white (no hue) until they're tapped.
  const WHITE = '#FFFFFF';
  const hsl = (h) => `hsl(${h},70%,55%)`;
  const hueGap = (a, b) => { const d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); };
  // Circles may share colours (identical hues repel each other the hardest).
  // A random whole-degree hue at least `minGap` degrees from every hue in `avoid`
  // (so a tap's change is easy to see).
  function randomHue(avoid, minGap) {
    for (let tries = 0; tries < 100; tries++) {
      const h = Math.floor(Math.random() * 360);
      if (avoid.every(a => a == null || hueGap(h, a) >= minGap)) return h;
    }
    return Math.floor(Math.random() * 360);
  }
  let hue = Math.floor(Math.random() * 360);
  const theme = document.querySelector('meta[name=theme-color]');
  function paint() {
    document.body.style.backgroundColor = hsl(hue);
    theme.setAttribute('content', hsl(hue));
  }
  function nextHue() {
    hue = randomHue([hue], 40); paint();
  }
  paint();

  // ----- Circles, stored in screen coordinates so zoom has no limits -----
  // Every zoom or pan is applied directly to each circle. Small circles keep a
  // centre point. Huge ones (bigger than BIG) are kept as "the point on the edge
  // nearest the screen, plus the direction to the centre", re-anchored every
  // frame, so their edges stay sharp however far you zoom in.
  const BIG = 2e6, SMALL = 1e6;
  const circles = [];  // {cx, cy, r, color, hue} or {big:true, ox, oy, nx, ny, r, color, hue}
  // Lines: pts is a flat [x0, y0, x1, y1, ...] smoothed polyline in screen
  // coordinates, w its thickness. raw holds the finger points while drawing.
  const strokes = [];
  // Black dots dragged out of the corner. Stored like circles (same small/big
  // forms) so they zoom and turn with everything else; they emit coloured
  // circles while forces are on. wait = seconds until the next one.
  const dots = [];     // {cx, cy, r, wait} or the big form
  const emitWait = () => -Math.log(1 - Math.random()) * EMIT_MEAN_S;
  const emitStats = { circle: 0, hunter: 0, chaser: 0 };   // what dots and spawners have released (for tests)
  // Red and blue spawners dragged out of those corners: static like black dots
  // (same small/big forms), releasing hunters (red) or chasers (blue) while forces are on.
  const spawners = [];  // {cx, cy, r, kind: 'hunter' | 'chaser', wait} or the big form
  const spawnWait = () => -Math.log(1 - Math.random()) * SPAWNER_MEAN_S;
  // Red hunters dragged out of the other corner: same small/big forms as circles.
  // Each one chases the nearest circle and pops it.
  const hunters = [];  // {cx, cy, r} or the big form
  const pops = [];     // {x, y, r, color, t0}: pop animations, in screen coordinates
  // Blue chasers dragged out of the top corner: they go after hunters.
  const chasers = [];  // {cx, cy, r} or the big form
  // The player: a white dot pinned to the screen centre. Tilting moves the world
  // the other way, so the dot seems to travel. It never changes size (apart from
  // zooming): eating a smaller circle scores a point, a hunter catching it costs 5,
  // and a bigger circle covering it ends the game. invUntil = end of the blinking
  // safe time after a restart; huntSafeUntil = end of the 1 s safe time after a catch.
  let playerOn = true;   // tests can switch the player off
  // scale = zoom since the player (re)started, so its speed scales with zoom like a hunter's;
  // guard = after a restart, stay safe until no bigger circle covers the player.
  // size is always 1 (kept for anything reading the old field).
  const player = { cx: 0, cy: 0, r: PLAYER_R, scale: 1, eaten: 0, score: 0, caught: 0, size: 1, over: false, invUntil: 0, guard: false, huntSafeUntil: 0, vx: 0, vy: 0 };
  const history = [];  // circles, lines, dots, hunters and chasers in the order they were made, for undo
  function undoLast() {
    while (history.length) {
      const item = history.pop();
      const list = { circle: circles, dot: dots, hunter: hunters, chaser: chasers, line: strokes,
                     hunterSpawner: spawners, chaserSpawner: spawners }[item.type];
      const i = list.indexOf(item.obj);
      if (i < 0) continue;
      list.splice(i, 1);
      dirty = true;
      toast({ circle: 'Removed circle', dot: 'Removed dot', hunter: 'Removed hunter', chaser: 'Removed chaser', line: 'Removed line',
              hunterSpawner: 'Removed hunter spawner', chaserSpawner: 'Removed chaser spawner' }[item.type]);
      if (navigator.vibrate) navigator.vibrate(10);
      return;
    }
    toast('Nothing to remove');
  }

  // Smooth a flat point list with Chaikin corner-cutting, keeping both ends.
  function smooth(raw, passes) {
    let p = raw;
    for (let n = 0; n < passes; n++) {
      if (p.length < 6) break;
      const q = [p[0], p[1]];
      for (let i = 0; i + 3 < p.length; i += 2) {
        const x0 = p[i], y0 = p[i + 1], x1 = p[i + 2], y1 = p[i + 3];
        q.push(0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1, 0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1);
      }
      q.push(p[p.length - 2], p[p.length - 1]);
      p = q;
    }
    return p;
  }
  // Bounding box of a line, plus boxes for each run of CHUNK segments so
  // collisions only look closely at the parts of a line near a circle.
  const CHUNK = 16;
  function strokeBox(st) {
    if (!st.box) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const p = st.pts, chunks = [];
      for (let s = 0; s < p.length; s += 2 * CHUNK) {
        let cx0 = Infinity, cy0 = Infinity, cx1 = -Infinity, cy1 = -Infinity;
        const end = Math.min(p.length, s + 2 * CHUNK + 2);
        for (let i = s; i < end; i += 2) {
          const x = p[i], y = p[i + 1];
          if (x < cx0) cx0 = x; if (x > cx1) cx1 = x; if (y < cy0) cy0 = y; if (y > cy1) cy1 = y;
        }
        chunks.push(s, end, cx0, cy0, cx1, cy1);
        if (cx0 < x0) x0 = cx0; if (cx1 > x1) x1 = cx1; if (cy0 < y0) y0 = cy0; if (cy1 > y1) y1 = cy1;
      }
      st.box = [x0, y0, x1, y1];
      st.chunks = chunks;
    }
    return st.box;
  }
  let W = innerWidth, H = innerHeight;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d'), mainCtx = ctx;
  // The corner dot sits 32px in from the bottom-left, clear of any notch or home bar.
  const safeProbe = document.getElementById('safe');
  let dockX = 32, dockY = H - 32, redX = W - 32, redY = H - 32, blueX = 32, blueY = 32;
  const overlay = document.getElementById('o');   // flashing red dots and pops, redrawn every frame
  const octx = overlay.getContext('2d');
  function resize() {
    W = innerWidth; H = innerHeight;
    const cs = getComputedStyle(safeProbe);
    dockX = 32 + (parseFloat(cs.paddingLeft) || 0);
    dockY = H - 32 - (parseFloat(cs.paddingBottom) || 0);
    redX = W - 32 - (parseFloat(cs.paddingRight) || 0); redY = dockY;
    blueX = dockX; blueY = 32 + (parseFloat(cs.paddingTop) || 0);       // below any notch or status bar
    const d = devicePixelRatio || 1;
    canvas.width = Math.round(W * d); canvas.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    overlay.width = canvas.width; overlay.height = canvas.height;
    octx.setTransform(d, 0, 0, d, 0, 0);
    dirty = true;
  }

  // Rotate everything by angle a (radians) and scale by k around screen point
  // (px, py), then move by (dx, dy).
  function transformAll(k, px, py, dx, dy, a = 0) {
    const cos = Math.cos(a) * k, sin = Math.sin(a) * k;
    const cs = Math.cos(a), sn = Math.sin(a);
    for (const c of circles.concat(dots, hunters, chasers, spawners)) {
      if (c.big) {
        const x = c.ox - px, y = c.oy - py;
        c.ox = px + x * cos - y * sin + dx; c.oy = py + x * sin + y * cos + dy;
        const nx = c.nx * cs - c.ny * sn, ny = c.nx * sn + c.ny * cs;
        c.nx = nx; c.ny = ny;
      } else {
        const x = c.cx - px, y = c.cy - py;
        c.cx = px + x * cos - y * sin + dx; c.cy = py + x * sin + y * cos + dy;
      }
      if (c.vx) { const vx = c.vx, vy = c.vy; c.vx = vx * cos - vy * sin; c.vy = vx * sin + vy * cos; }
      c.r *= k;
    }
    player.r *= k; player.scale *= k;
    for (const st of strokes) {
      for (const arr of [st.pts, st.raw]) {
        if (!arr) continue;
        for (let i = 0; i < arr.length; i += 2) {
          const x = arr[i] - px, y = arr[i + 1] - py;
          arr[i] = px + x * cos - y * sin + dx; arr[i + 1] = py + x * sin + y * cos + dy;
        }
      }
      st.w *= k; st.box = null;
    }
    normalise();
    dirty = true;
  }

  function normalise() {
    const sx = W / 2, sy = H / 2;
    for (const c of circles.concat(dots, hunters, chasers, spawners)) {
      if (!c.big && c.r > BIG) {
        let dx = sx - c.cx, dy = sy - c.cy, L = Math.hypot(dx, dy);
        if (L === 0) { dx = 1; dy = 0; L = 1; }
        c.big = true;
        c.ox = c.cx + dx / L * c.r; c.oy = c.cy + dy / L * c.r;
        c.nx = -dx / L; c.ny = -dy / L;
      } else if (c.big && c.r < SMALL) {
        c.big = false;
        c.cx = c.ox + c.nx * c.r; c.cy = c.oy + c.ny * c.r;
      }
      if (c.big) {
        // Slide the anchor along the edge to the point nearest the screen centre.
        const ux = -c.ny, uy = c.nx;
        const t = (sx - c.ox) * ux + (sy - c.oy) * uy;
        if (!isFinite(c.r)) { c.ox += ux * t; c.oy += uy * t; continue; }
        if (Math.abs(t) >= c.r) continue;
        const root = Math.sqrt((c.r - t) * (c.r + t));
        const sag = t * t / (c.r + root);
        c.ox += ux * t + c.nx * sag; c.oy += uy * t + c.ny * sag;
        let nx = c.nx * (1 - sag / c.r) - ux * (t / c.r), ny = c.ny * (1 - sag / c.r) - uy * (t / c.r);
        const L = Math.hypot(nx, ny); c.nx = nx / L; c.ny = ny / L;
      }
    }
  }

  // ----- Colour forces -----
  // Each pair of coloured circles pulls or pushes by how far apart their hues are:
  // opposite hues (180° apart) attract most, neighbouring hues repel most, and
  // hues 90° apart ignore each other. White circles have no hue and feel nothing.
  // Bigger circles pull harder. The rule scales with zoom, so it looks the same
  // at any zoom level. Circles bump rather than overlap.
  const G = 6;              // overall strength
  const DAMPING = 1.2;      // friction, per second
  const RESTITUTION = 0.3;  // bounciness when circles touch
  const SOFT_RATE = 30;     // how quickly partly permeable circles are eased apart (per second)
  let forcesOn = false;
  let lastT = performance.now();

  // Coloured circles run from hunters: each hunter within 6 circle radii + 10 hunter
  // radii adds an acceleration away from it, strongest close up ((1 - d/R)²). It's
  // an extra force in the normal physics, so damping, bumps, lines and permeability
  // all still apply. Top speed (accel / damping) is about half a hunter's, so they
  // can still be caught. Worked out once a frame over a grid of the hunters.
  const fleeing = [];                 // circles with a flee acceleration this frame (fx, fy)
  let fleeBuf = { cap: 0 };
  function circleFlee() {
    for (const c of fleeing) { c.fx = 0; c.fy = 0; }
    fleeing.length = 0;
    // Hunters copied to flat arrays: hunter objects come in many shapes, which makes
    // reading their fields in the inner loop slow.
    if (fleeBuf.cap < hunters.length) { const n = Math.max(64, hunters.length * 2); fleeBuf = { cap: n, x: new Float64Array(n), y: new Float64Array(n), r: new Float64Array(n) }; }
    const HX = fleeBuf.x, HY = fleeBuf.y, HR = fleeBuf.r;
    let n = 0, x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, maxR = 0;
    for (const h of hunters) {
      if (h.big || !(h.r > 0) || !isFinite(h.cx) || !isFinite(h.cy) || !isFinite(h.r)) continue;
      const x = h.cx, y = h.cy; HX[n] = x; HY[n] = y; HR[n] = h.r; n++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (h.r > maxR) maxR = h.r;
    }
    if (!n) return;
    let cs = 20 * maxR;
    while (((x1 - x0) / cs + 1) * ((y1 - y0) / cs + 1) > 4096) cs *= 2;
    const nx = Math.floor((x1 - x0) / cs) + 1, ny = Math.floor((y1 - y0) / cs) + 1, cells = new Array(nx * ny);
    for (let k = 0; k < n; k++) {
      const i = Math.floor((HX[k] - x0) / cs) + nx * Math.floor((HY[k] - y0) / cs);
      (cells[i] || (cells[i] = [])).push(k);
    }
    const allIdx = []; for (let k = 0; k < n; k++) allIdx.push(k);
    const held = press && press.circle, A = CIRCLE_FLEE_ACCEL;
    for (const c of circles) {
      if (c.big || c.hue == null || !(c.r > 0) || c === held || !isFinite(c.r)) continue;   // white circles don't run
      const cx = c.cx, cy = c.cy, r6 = 6 * c.r, reach = r6 + 10 * maxR;
      if (cx < x0 - reach || cx > x1 + reach || cy < y0 - reach || cy > y1 + reach) continue;
      let ax = 0, ay = 0;
      const ia = Math.max(0, Math.floor((cx - reach - x0) / cs)), ib = Math.min(nx - 1, Math.floor((cx + reach - x0) / cs));
      const ja = Math.max(0, Math.floor((cy - reach - y0) / cs)), jb = Math.min(ny - 1, Math.floor((cy + reach - y0) / cs));
      const all = (ib - ia + 1) * (jb - ja + 1) > n;           // fewer hunters than cells: check them all
      for (let j = all ? 0 : ja; j <= (all ? 0 : jb); j++) for (let i = all ? 0 : ia; i <= (all ? 0 : ib); i++) {
        const list = all ? allIdx : cells[i + nx * j];
        if (!list) continue;
        for (let m = 0; m < list.length; m++) {
          const k = list[m], R = r6 + 10 * HR[k], dx = cx - HX[k], dy = cy - HY[k];
          if (!(dx < R && dx > -R && dy < R && dy > -R)) continue;
          const d2 = dx * dx + dy * dy;
          if (!(d2 < R * R)) continue;
          const d = Math.sqrt(d2), q = 1 - d / R, f = A * HR[k] * q * q;
          if (d > 0) { ax += dx / d * f; ay += dy / d * f; }
          else { const t = Math.random() * Math.PI * 2; ax += Math.cos(t) * f; ay += Math.sin(t) * f; }
        }
      }
      if (ax || ay) { c.fx = ax; c.fy = ay; fleeing.push(c); }
    }
  }

  const bodies = [], coloured = [];   // reused every step, no per-step garbage
  const BUF_KEYS = ['x', 'y', 'r', 'hc', 'hs', 'ax', 'ay'], buf = { cap: 0 };
  // pull = colour forces on. With them off the step still runs while circles are
  // fleeing or coasting: only moving circles move, but they bump into resting ones.
  function stepForces(dt, pull = true) {
    bodies.length = 0; coloured.length = 0;
    for (const c of circles) {
      if (c.big || !(c.r > 0) || (press && press.circle === c)) continue;
      c.vx = c.vx || 0; c.vy = c.vy || 0; c.ax = c.fx || 0; c.ay = c.fy || 0;
      c.awake = pull || c.vx !== 0 || c.vy !== 0 || c.ax !== 0 || c.ay !== 0;
      // Solidity = 1 - permeability: a circle the background's colour lets others
      // pass straight through it; the opposite colour is fully solid. White is solid.
      c.solid = c.hue == null ? 1 : hueGap(c.hue, hue) / 180;
      bodies.push(c);
      if (pull && c.hue != null) {
        const t = c.hue * Math.PI / 180; c.hc = Math.cos(t); c.hs = Math.sin(t);  // cos(gap) = hc·hc' + hs·hs'
        coloured.push(c);
      }
    }
    // All pairs, on flat typed arrays (much faster than object fields for big counts).
    const n = coloured.length;
    if (n > buf.cap) { buf.cap = Math.max(n, buf.cap * 2); for (const k of BUF_KEYS) buf[k] = new Float64Array(buf.cap); }
    const X = buf.x, Y = buf.y, R = buf.r, HC = buf.hc, HS = buf.hs, AX = buf.ax, AY = buf.ay;
    for (let i = 0; i < n; i++) {
      const c = coloured[i]; X[i] = c.cx; Y[i] = c.cy; R[i] = c.r; HC[i] = c.hc; HS[i] = c.hs; AX[i] = 0; AY[i] = 0;
    }
    for (let i = 0; i < n; i++) {
      const ax0 = X[i], ay0 = Y[i], ar = R[i], ahc = HC[i], ahs = HS[i];
      let fax = 0, fay = 0;
      for (let j = i + 1; j < n; j++) {
        const br = R[j], dx = X[j] - ax0, dy = Y[j] - ay0, d = Math.sqrt(dx * dx + dy * dy);
        const ux = d > 0 ? dx / d : 1, uy = d > 0 ? dy / d : 0;
        const pull = -(ahc * HC[j] + ahs * HS[j]);   // +1 opposite hues attract … -1 neighbours repel
        const soft = d > ar + br ? d : ar + br;      // no runaway force once touching
        const k = G * pull / soft;                    // 2D gravity: acceleration ~ mass / distance
        const kb = k * br, ka = k * ar;               // (k·r)·r keeps tiny circles from underflowing
        fax += ux * kb * br; fay += uy * kb * br;
        AX[j] -= ux * ka * ar; AY[j] -= uy * ka * ar;
      }
      AX[i] += fax; AY[i] += fay;
    }
    for (let i = 0; i < n; i++) { coloured[i].ax += AX[i]; coloured[i].ay += AY[i]; }
    const f = Math.exp(-DAMPING * dt);

    get playerOn() { return playerOn; }, set playerOn(v) { playerOn = !!v; dirty = true; overEl.style.display = playerOn && player.over ? 'block' : 'none'; } };
</script>
